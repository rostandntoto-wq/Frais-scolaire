// Décompose la saisie combinée du champ "Classes" (ex : "2ème CG") en
// {classe, option} — l'option doit correspondre à une entrée du barème pour
// que le calcul des frais fonctionne, donc on reconnaît le suffixe connu.
function parseClasseComboInput(text, bareme){
  text = (text||"").trim();
  if(!text) return { classe:"", option:"" };
  const optionsParLongueur = [...bareme].sort((a,b) => b.option.length - a.option.length);
  for(const b of optionsParLongueur){
    if(text.toUpperCase() === b.option.toUpperCase()) return { classe:"", option:b.option };
    const suffixe = " " + b.option;
    if(text.toUpperCase().endsWith(suffixe.toUpperCase())){
      return { classe: text.slice(0, text.length - suffixe.length).trim(), option: b.option };
    }
  }
  // Aucune option du barème reconnue : on garde le texte tel quel comme
  // classe, sans option (le calcul des frais ne pourra pas s'appliquer tant
  // qu'une option valide n'est pas choisie/ajoutée au barème).
  return { classe: text, option: "" };
}

async function addEleve(){
  const nom = document.getElementById("ne-nom").value.trim();
  const modeClasse = state.data.ecole.baremeMode === "classe";
  const saisie = document.getElementById("ne-classe").value.trim();
  const { classe, option } = modeClasse
    ? { classe: saisie, option: saisie }
    : parseClasseComboInput(saisie, state.data.bareme);
  const postnom = document.getElementById("ne-postnom").value.trim();
  const prenom = document.getElementById("ne-prenom").value.trim();
  if(!nom || !classe) return;
  if(!option){
    const continuer = await showConfirm(
      modeClasse
        ? `Veuillez choisir une classe dans la liste.`
        : `\u00ab ${classe} \u00bb ne correspond à aucune option du barème connue (ex : CG, HP, CTEB...).\n\nL'élève sera ajouté sans option de tarification — ses frais ne pourront pas être calculés tant qu'une classe valide n'est pas choisie.\n\nContinuer quand même ?`,
      {title:"⚠️ Classe non reconnue", confirmLabel:"Ajouter quand même"}
    );
    if(!continuer) return;
  }

  // Détection de doublon : même nom + post-nom + classe déjà présents.
  // Recherche indexée (O(1)) plutôt qu'un balayage complet — reste rapide
  // même avec des milliers d'élèves.
  const eleveDupIndex = getEleveDupIndex();
  const doublon = eleveDupIndex.get(eleveDupKey(nom, postnom, classe));
  if(doublon){
    const continuer = await showConfirm(
      `Un élève \u00ab ${doublon.nom} ${doublon.postnom} \u00bb existe déjà dans la classe ${doublon.classe}.\n\nVoulez-vous quand même ajouter cette nouvelle fiche (élève homonyme) ?`,
      {title:"⚠️ Doublon possible", confirmLabel:"Ajouter quand même"}
    );
    if(!continuer) return;
  }

  const nouvelEleve = {
    id: uid("el"),
    nom,
    postnom,
    prenom,
    sexe: document.getElementById("ne-sexe").value,
    classe,
    option,
    statut: document.getElementById("ne-statut").value,
    archive: false,
  };
  state.data.eleves.push(nouvelEleve);
  // Le tableau garde la même référence (push en place) : on met simplement
  // à jour l'index au lieu de le reconstruire entièrement.
  eleveDupIndex.set(eleveDupKey(nom, postnom, classe), nouvelEleve);
  journalAdd("Ajout élève", `${nom} — ${classe}${option ? " "+option : ""}`);
  saveData(); renderView();
}

/* ---------------- Import d'une liste d'élèves ---------------- */
function normalizeHeader(h){
  return (h||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // enlève les accents
    .replace(/[^a-z]/g,"");
}

function parseCsv(text){
  const delimiter = text.indexOf(";") > -1 && text.indexOf(";") < text.indexOf(",") + 1 ? ";" : (text.indexOf(",")>-1?",":";");
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  return lines.map(line => {
    const cells = [];
    let cur = "", inQuotes = false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c === '"'){ inQuotes = !inQuotes; }
      else if(c === delimiter && !inQuotes){ cells.push(cur); cur = ""; }
      else { cur += c; }
    }
    cells.push(cur);
    return cells.map(c => c.trim());
  });
}

function rowsToEleves(rows){
  if(rows.length < 2) return [];
  const header = rows[0].map(normalizeHeader);
  const idx = {
    nom: header.findIndex(h => h === "nom"),
    postnom: header.findIndex(h => h === "postnom"),
    prenom: header.findIndex(h => h === "prenom"),
    sexe: header.findIndex(h => h === "sexe"),
    classe: header.findIndex(h => h === "classe"),
    option: header.findIndex(h => h === "option"),
    statut: header.findIndex(h => h === "statut"),
  };
  if(idx.nom === -1 || idx.classe === -1) return null; // colonnes essentielles manquantes

  return rows.slice(1).filter(r => r[idx.nom]).map(r => ({
    id: uid("el"),
    nom: r[idx.nom] || "",
    postnom: idx.postnom>-1 ? (r[idx.postnom]||"") : "",
    prenom: idx.prenom>-1 ? (r[idx.prenom]||"") : "",
    sexe: idx.sexe>-1 ? (r[idx.sexe]||"M") : "M",
    classe: r[idx.classe] || "",
    option: idx.option>-1 ? (r[idx.option]||"") : "",
    statut: idx.statut>-1 ? (r[idx.statut]||"Normal") : "Normal",
  }));
}

document.getElementById("import-eleves-input").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const bytes = new Uint8Array(reader.result);
      let nouveaux = null;

      if(bytes.length >= 2 && bytes[0] === 0x50 && bytes[1] === 0x4B){ // .xlsx (ZIP) : vrai classeur Excel
        try{
          const wb = XLSX.read(bytes, { type: "array" });
          const nomFeuille = wb.SheetNames.includes("Élèves") ? "Élèves" : wb.SheetNames[0];
          const feuille = wb.Sheets[nomFeuille];
          const rows = XLSX.utils.sheet_to_json(feuille, { header: 1, raw: false, defval: "" });
          nouveaux = rows.length ? rowsToEleves(rows) : null;
        }catch(err){
          nouveaux = null;
        }
      } else {
        const text = new TextDecoder("utf-8").decode(bytes);
        if(text.indexOf("<?xml") === 0 || text.indexOf("<Workbook") !== -1){
          const doc = new DOMParser().parseFromString(text, "text/xml");
          if(!doc.getElementsByTagName("parsererror").length){
            const rows = sheetToRows(doc, "Élèves");
            nouveaux = rows.length ? rowsToEleves(rows) : null;
          }
        } else {
          nouveaux = rowsToEleves(parseCsv(text));
        }
      }

      if(!nouveaux){
        await showAlert("Fichier non reconnu ou colonnes manquantes. Colonnes attendues : Nom, Post-nom, Prénom, Sexe, Classe, Option, Statut (dans une feuille nommée \u00ab Élèves \u00bb si le classeur en contient plusieurs).\n\nLe CSV (Fichier > Enregistrer sous > CSV dans Excel) reste une valeur sûre en cas de souci.");
        e.target.value = "";
        return;
      }
      if(nouveaux.length === 0){
        await showAlert("Aucune ligne d'élève trouvée dans ce fichier.");
        e.target.value = "";
        return;
      }

      state.data.eleves = [...state.data.eleves, ...nouveaux];
      journalAdd("Import liste d'élèves", `${nouveaux.length} élève(s) importé(s) depuis ${file.name}`);
      saveData(); renderView();
      await showAlert(nouveaux.length + " élève(s) importé(s) avec succès.");
    }catch(err){
      console.error(err);
      await showAlert("Une erreur est survenue pendant l'import de ce fichier.");
    }
    e.target.value = "";
  };
  reader.readAsArrayBuffer(file);
});

const MAX_RECEIPTS_SELECTION = 6;

function playLimitBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.value = 0.001;
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
    setTimeout(() => ctx.close(), 300);
  }catch(e){}
}

function togglePaiementSelect(id){
  if(state.selectedPaiements.has(id)){
    state.selectedPaiements.delete(id);
  } else {
    if(state.selectedPaiements.size >= MAX_RECEIPTS_SELECTION){
      playLimitBeep();
      renderView(); // remet la case décochée visuellement
      return;
    }
    state.selectedPaiements.add(id);
  }
  renderView();
}

  state.selectedPaiements.clear();
  renderView();
}

async function addPaiement(){
  const nameVal = document.getElementById("np-eleve-name").value;
  const el = findEleveByTypedName(nameVal);
  const montant = Number(document.getElementById("np-montant").value) || 0;
  const trimestre = Number(document.getElementById("np-trimestre").value);
  const date = document.getElementById("np-date").value;
  if(!el){ await showAlert("Élève introuvable. Vérifiez l'orthographe ou choisissez un nom proposé dans la liste."); return; }
  if(!montant) return;

  // ---- Contrôle d'intégrité : dépassement du solde du trimestre ----
  // Bloquant : un paiement qui dépasse le solde dû n'est jamais autorisé,
  // même volontairement — on informe et on annule, sans option de passer outre.
  const due = tarifPourEleve(state.data.bareme, el, trimestre);
  const payMap = paiementsParEleve(state.data.paiements);
  const dejaEncaisse = payeTotal(payMap, el.id, trimestre);
  const solde = due - dejaEncaisse;
  if(due > 0 && montant > solde){
    const depassement = montant - solde;
    await showAlert(
      `Ce paiement dépasse le solde dû de ${money(depassement)} — il n'a pas été enregistré.\n\n` +
      `Élève           : ${el.nom} ${el.postnom} ${el.prenom}\n` +
      `Trimestre       : T${trimestre}\n` +
      `Montant dû      : ${money(due)}\n` +
      `Déjà encaissé   : ${money(dejaEncaisse)}\n` +
      `Solde           : ${money(Math.max(0,solde))}\n` +
      `Montant saisi   : ${money(montant)}\n\n` +
      `Corrigez le montant avant d'enregistrer.`,
      {title:"⚠️ Montant supérieur au solde dû"}
    );
    return;
  }

  // ---- Détection de doublon : même élève, trimestre, montant et date ----
  // Recherche indexée (O(1)) au lieu d'un balayage complet — indispensable
  // pour rester rapide avec 20 000, 50 000 paiements ou plus.
  const paiementDupIndex = getPaiementDupIndex();
  const doublon = paiementDupIndex.get(paiementDupKey(el.id, trimestre, montant, date));
  if(doublon){
    const continuer = await showConfirm(
      `Un paiement identique existe déjà pour cet élève :\n\n` +
      `Reçu ${receiptCode(doublon)} — T${trimestre} — ${money(montant)} — ${dateFr(date)}\n\n` +
      `Voulez-vous quand même enregistrer ce nouveau paiement ?`,
      {title:"⚠️ Doublon possible", confirmLabel:"Enregistrer quand même"}
    );
    if(!continuer) return;
  }

  const numero = nextReceiptNumber();
  const nouveauPaiement = {
    id: uid("pay"),
    numero,
    recuCode: state.currentRecuCode || "",
    createdAt: new Date().toISOString(),
    eleveId: el.id,
    trimestre,
    date,
    montant,
    payeur: document.getElementById("np-payeur").value,
    obs: document.getElementById("np-obs").value,
    annule: false,
  };
  state.data.paiements.push(nouveauPaiement);
  // Même principe que pour les élèves : mise à jour incrémentale des index
  // plutôt que reconstruction complète.
  paiementDupIndex.set(paiementDupKey(el.id, trimestre, montant, date), nouveauPaiement);
  noteReceiptNumberUsed(numero);
  journalAdd("Encaissement", `Reçu ${receiptCode(nouveauPaiement)} — ${el.nom} ${el.postnom} — ${money(montant)} (T${trimestre})`);
  saveData(); renderView();
}

async function annulerPaiement(id){
  const p = state.data.paiements.find(x=>x.id===id);
  if(!p) return;
  const el = state.data.eleves.find(e=>e.id===p.eleveId);
  if(!(await showConfirm(`Annuler le reçu ${receiptCode(p)} (${money(p.montant)}) ?\n\nLe reçu reste visible dans l'historique, marqué \u00ab ANNULÉ \u00bb — il ne compte plus dans les totaux encaissés.`, {title:"Annulation de reçu"}))) return;
  const motif = await showPrompt("Motif de l'annulation — facultatif :", "", {title:"Annuler ce reçu"});
  // Un paiement annulé ne doit plus compter comme doublon potentiel : on
  // force la reconstruction de l'index au prochain ajout.
  paiementDupIndexArr = null;
  p.annule = true;
  p.annulePar = getCurrentUser();
  p.annuleLe = new Date().toISOString();
  p.motifAnnulation = motif || "";
  journalAdd("Annulation paiement", `Reçu ${receiptCode(p)} — ${el?el.nom+' '+el.postnom:'—'} — ${money(p.montant)}${motif?' — motif : '+motif:''}`);
  saveData(); renderView();
}

/* ---------------- Génération de PDF (sans bibliothèque externe) ---------------- */
/* ---------------- Génération PDF (moteur autonome, sans dépendance réseau) ----------------
   Remarque historique : une version basée sur la bibliothèque jsPDF (chargée
   via CDN) a été essayée, mais elle s'est révélée peu fiable — CDN bloqué ou
   inaccessible selon les postes/connexions, et un bug connu de la version
   hébergée sur cdnjs ("jsPDF is not a constructor" chez plusieurs
   utilisateurs). Dans un contexte d'école avec connexion internet limitée,
   dépendre d'un CDN pour une fonctionnalité aussi centrale (impression des
   reçus) est trop risqué. Retour au générateur PDF minimal écrit à la main,
   qui fonctionne 100% hors-ligne. */
function pdfEscapeText(str){
  // normalise les espaces "fines" utilisées par toLocaleString (non représentables en Latin-1)
  let normalized = String(str).replace(/[\u202F\u00A0\u2009]/g, " ");
  let out = "";
  for(const ch of normalized){
    const code = ch.codePointAt(0);
    out += code <= 255 ? ch : "?";
  }
  return out.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
}

// ops: [{type:'text', x,y,size,bold,text,color:[r,g,b] 0-1}, {type:'rect',x,y,w,h,stroke:[r,g,b],lineWidth}, {type:'line',x1,y1,x2,y2,color:[r,g,b],lineWidth}]
function opsToContentStream(ops, pageH){
  let content = "";
  ops.forEach(op => {
    if(op.type === "text"){
      const c = op.color || [0.11,0.16,0.29];
      content += `${c[0]} ${c[1]} ${c[2]} rg\nBT\n/${op.bold?"F2":"F1"} ${op.size||10} Tf\n${op.x} ${pageH-op.y} Td\n(${pdfEscapeText(op.text)}) Tj\nET\n`;
    } else if(op.type === "rect"){
      const c = op.stroke || [0.11,0.16,0.29];
      content += `${c[0]} ${c[1]} ${c[2]} RG\n${op.lineWidth||1} w\n${op.x} ${pageH-op.y-op.h} ${op.w} ${op.h} re\nS\n`;
    } else if(op.type === "line"){
      const c = op.color || [0.11,0.16,0.29];
      content += `${c[0]} ${c[1]} ${c[2]} RG\n${op.lineWidth||1} w\n${op.x1} ${pageH-op.y1} m\n${op.x2} ${pageH-op.y2} l\nS\n`;
    }
  });
  return content;
}

function buildPdfBytes(pageW, pageH, ops){
  return buildPdfMultiPage(pageW, pageH, [ops]);
}

// pagesOps : tableau de pages, chaque page étant un tableau d'opérations de dessin.
function buildPdfMultiPage(pageW, pageH, pagesOps){
  const nPages = pagesOps.length;
  const objects = [];
  objects.push(`<< /Type /Catalog /Pages 2 0 R >>`); // obj 1
  const pageRefs = [];
  for(let i=0;i<nPages;i++) pageRefs.push(`${3+i*2} 0 R`);
  objects.push(`<< /Type /Pages /Kids [${pageRefs.join(" ")}] /Count ${nPages} >>`); // obj 2

  const fontF1Num = 3 + nPages*2;
  const fontF2Num = fontF1Num + 1;

  for(let i=0;i<nPages;i++){
    const content = opsToContentStream(pagesOps[i], pageH);
    const pageObjNum = 3+i*2;
    const contentObjNum = 4+i*2;
    objects[pageObjNum-1] = `<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 ${fontF1Num} 0 R /F2 ${fontF2Num} 0 R >> >> /MediaBox [0 0 ${pageW} ${pageH}] /Contents ${contentObjNum} 0 R >>`;
    objects[contentObjNum-1] = `<< /Length ${content.length} >>\nstream\n${content}endstream`;
  }
  objects[fontF1Num-1] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objects[fontF2Num-1] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;

  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  objects.forEach((obj, i) => {
    offsets.push(pdf.length);
    pdf += `${i+1} 0 obj\n${obj}\nendobj\n`;
  });
  const xrefStart = pdf.length;
  pdf += `xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=objects.length;i++){
    pdf += String(offsets[i]).padStart(10,"0") + " 00000 n \n";
  }
  pdf += `trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;

  const bytes = new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return bytes;
}

// Construit un rapport tabulaire paginé (A4) à partir de colonnes + lignes de texte.
function buildTablePdfPages(title, subtitle, columns, rows, footerLines){
  const pageW = 595, pageH = 842, marginX = 40, marginBottom = 50;
  const rowHeight = 15;
  const tableTop = subtitle ? 100 : 84;
  const usableHeight = pageH - marginBottom - tableTop;
  const rowsPerPage = Math.max(5, Math.floor(usableHeight / rowHeight) - 2);
  const chunks = [];
  for(let i=0;i<rows.length;i+=rowsPerPage) chunks.push(rows.slice(i, i+rowsPerPage));
  if(chunks.length === 0) chunks.push([]);

  const pages = chunks.map((chunk, pageIdx) => {
    const ops = [];
    let y = 44;
    ops.push({type:"text", x:marginX, y, size:15, bold:true, text:title}); y += 18;
    if(subtitle){ ops.push({type:"text", x:marginX, y, size:9, text:subtitle, color:[0.4,0.4,0.4]}); y += 14; }
    y += 6;
    let x = marginX;
    columns.forEach(col => {
      ops.push({type:"text", x, y, size:9, bold:true, text:col.label});
      x += col.width;
    });
    y += 6;
    ops.push({type:"line", x1:marginX, y1:y, x2:pageW-marginX, y2:y, lineWidth:1});
    y += 14;
    chunk.forEach(rowVals => {
      let xr = marginX;
      rowVals.forEach((val, ci) => {
        ops.push({type:"text", x:xr, y, size:8.5, text:String(val===undefined||val===null?"":val)});
        xr += columns[ci].width;
      });
      y += rowHeight;
    });
    if(pageIdx === chunks.length-1 && footerLines && footerLines.length){
      y += 10;
      ops.push({type:"line", x1:marginX, y1:y, x2:pageW-marginX, y2:y, lineWidth:1}); y += 16;
      footerLines.forEach(line => {
        ops.push({type:"text", x:marginX, y, size:10, bold:true, text:line});
        y += 15;
      });
    }
    ops.push({type:"text", x:pageW-marginX-70, y:pageH-24, size:8, text:`Page ${pageIdx+1}/${chunks.length}`, color:[0.5,0.5,0.5]});
    return ops;
  });

  return buildPdfMultiPage(pageW, pageH, pages);
}

// "bytes" est un Uint8Array contenant le PDF complet — téléchargement via Blob.
function downloadPdfBytes(bytes, filename){
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function receiptPdfOps(d, payment){
  const el = d.eleves.find(e=>e.id===payment.eleveId);
  const numero = receiptCode(payment);
  const ink = [0.118,0.165,0.290];
  const gold = [0.722,0.525,0.231];
  const paid = [0.184,0.420,0.310];
  const late = [0.651,0.263,0.180];
  const gris = [0.4,0.4,0.4];
  const ops = [];
  let y = 42;

  // En-tête : nom de l'école + sous-titre (reformulé pour correspondre au
  // modèle validé — logo, nom de l'école, "Registre des frais scolaires").
  ops.push({type:"text", x:180-((d.ecole.nom||"").length*3), y, size:14, bold:true, text:d.ecole.nom, color:ink}); y+=15;
  ops.push({type:"text", x:180-40, y, size:9, text:"Registre des frais scolaires", color:gris}); y+=10;
  ops.push({type:"line", x1:40, y1:y, x2:320, y2:y, color:ink, lineWidth:1.2}); y+=22;

  // Titre + badge du numéro de reçu (encadré, comme le modèle)
  ops.push({type:"text", x:40, y, size:13, bold:true, text:"REÇU DE PAIEMENT", color:ink});
  ops.push({type:"rect", x:255, y:y-11, w:65, h:16, stroke:late, lineWidth:1.2});
  ops.push({type:"text", x:262, y:y, size:10, bold:true, text:numero, color:late});
  y += 22;

  const paireChamps = (labelG, valG, labelD, valD) => {
    ops.push({type:"text", x:40, y, size:9, text:labelG, color:gris});
    ops.push({type:"text", x:110, y, size:10, bold:true, text:String(valG), color:ink});
    if(labelD){
      ops.push({type:"text", x:220, y, size:9, text:labelD, color:gris});
      ops.push({type:"text", x:265, y, size:10, bold:true, text:String(valD), color:ink});
    }
    y += 16;
  };
  ops.push({type:"text", x:40, y, size:9, text:"Élève", color:gris});
  ops.push({type:"text", x:110, y, size:10, bold:true, text: el ? `${el.nom} ${el.postnom} ${el.prenom}` : "-", color:ink});
  y += 16;
  paireChamps("Classe", el ? classeOptionLabel(el) : "-", "Trimestre", `T${payment.trimestre}`);
  paireChamps("Date", dateFr(payment.date), "Payeur", payment.payeur || "");
  y += 4;

  if(payment.annule){
    ops.push({type:"rect", x:40, y:y-14, w:280, h:26, stroke:late, lineWidth:1.5});
    ops.push({type:"text", x:130, y:y+4, size:14, bold:true, text:"ANNULÉ", color:late});
    y += 34;
  }

  ops.push({type:"rect", x:40, y:y-16, w:280, h:44, stroke:ink, lineWidth:1});
  ops.push({type:"text", x:50, y:y+2, size:12, bold:true, text:"Montant reçu", color:ink});
  ops.push({type:"text", x:220, y:y+2, size:12, bold:true, text:money(payment.montant), color:paid});
  y += 18;
  ops.push({type:"text", x:50, y:y+2, size:7.5, text:"En toutes lettres :", color:gris});
  y += 10;
  ops.push({type:"text", x:50, y:y+2, size:7.5, bold:true, text:montantEnLettres(payment.montant), color:ink});
  y += 26;

  ops.push({type:"text", x:40, y, size:9, text:"Observation :", color:gris});
  if(payment.obs){
    ops.push({type:"text", x:110, y, size:9, text:payment.obs, color:ink});
  } else {
    ops.push({type:"line", x1:110, y1:y+2, x2:300, y2:y+2, color:[0.85,0.85,0.85], lineWidth:0.8});
  }
  y += 30;

  ops.push({type:"line", x1:60, y1:y+30, x2:150, y2:y+30, color:ink, lineWidth:0.8});
  ops.push({type:"text", x:60, y:y+42, size:8, text:"Sceau de l'école", color:ink});
  ops.push({type:"line", x1:200, y1:y+30, x2:290, y2:y+30, color:ink, lineWidth:0.8});
  ops.push({type:"text", x:200, y:y+42, size:8, text:"Signature du caissier", color:ink});

  return ops;
}

function downloadPaymentsListPdf(){

  list.sort((a,b)=>(b.createdAt||b.date||"").localeCompare(a.createdAt||a.date||"") || (Number(b.numero)||0)-(Number(a.numero)||0));

  const columns = [
    {label:"Reçu", width:55}, {label:"Élève", width:130}, {label:"Classe", width:110},

function downloadRecouvrementPdf(){
  const d = state.data;
  const t = state.dashboardTrimestre;
  const elevesActifs = d.eleves.filter(e => !e.archive);
  const payMap = paiementsParEleve(d.paiements);
  const parGroupe = {};

  elevesActifs.forEach(el => {
    const due = tarifPourEleve(d.bareme, el, t);
    const paye = payeTotal(payMap, el.id, t);
    const classe = el.classe || "Sans classe";
    const option = el.option || "Sans option";
    const key = classe + "|" + option;
    if(!parGroupe[key]) parGroupe[key] = {classe, option, due:0, paye:0, n:0};
    parGroupe[key].due += due; parGroupe[key].paye += paye; parGroupe[key].n++;
  });

  const groupes = Object.values(parGroupe).sort((a,b) => {
    const c = a.classe.localeCompare(b.classe);
    return c !== 0 ? c : a.option.localeCompare(b.option);
  });

  const columns = [
    {label:"Classe", width:150}, {label:"Élèves", width:60},
    {label:"Dû", width:100}, {label:"Encaissé", width:100}, {label:"Taux", width:60},
  ];
  const rows = groupes.map(g => {
    const label = g.option === "Sans option" ? g.classe : `${g.classe} ${g.option}`;
    const taux = g.due>0 ? Math.round(g.paye/g.due*100) : 0;
    return [label, g.n, money(g.due), money(g.paye), taux+"%"];
  });
  const totalDue = groupes.reduce((s,g)=>s+g.due,0);
  const totalPaye = groupes.reduce((s,g)=>s+g.paye,0);

  const bytes = buildTablePdfPages(
    `Recouvrement par classe et option — Trimestre ${t}`,
    `${d.ecole.nom} — Année scolaire ${d.ecole.anneeScolaire}`,
    columns, rows,
    [`Total dû : ${money(totalDue)}    Total encaissé : ${money(totalPaye)}`]
  );
  downloadPdfBytes(bytes, `recouvrement-classe-option-T${t}.pdf`);
}

/* ---------------- Sauvegarde liée à un classeur Excel ---------------- */
/* Génère un vrai classeur multi-feuilles (format SpreadsheetML), lisible et
   modifiable dans Excel, sans dépendre d'aucune bibliothèque externe —
   donc ça marche même hors ligne. */

const SS_NS = "urn:schemas-microsoft-com:office:spreadsheet";

function xmlCell(type, value){
  if(value === undefined || value === null || value === "") return "<Cell><Data ss:Type=\"String\"></Data></Cell>";
  return `<Cell><Data ss:Type="${type}">${esc(value)}</Data></Cell>`;
}
function xmlRow(cells){
  return "<Row>" + cells.map(([t,v]) => xmlCell(t,v)).join("") + "</Row>";
}
function xmlSheet(name, rows){
  return `<Worksheet ss:Name="${esc(name)}"><Table>${rows.join("")}</Table></Worksheet>`;
}

/* ================================================================
   Classeur .xlsx moderne (vrai format Office Open XML / ZIP)
   Le XML des feuilles est généré ici même (transparent, facile à déboguer),
   mais l'empaquetage ZIP est délégué à JSZip (bibliothèque éprouvée, CDN) —
   voir plus bas — plutôt que codé à la main comme auparavant.
   ================================================================ */

/* ---------------- Lecture/écriture ZIP (pour les classeurs .xlsx) ----------------
   Moteur ZIP autonome (méthode "stored", sans compression), écrit à la main.
   Remarque historique : une version basée sur JSZip (CDN) a été essayée,
   mais s'est révélée peu fiable sans connexion internet stable — voir la
   note au-dessus du générateur PDF. Retour au moteur autonome, qui
   fonctionne 100% hors-ligne et est 100% valide (testé dans Excel,
   LibreOffice, Google Sheets). */

/* ---- CRC32 (nécessaire pour le format ZIP) ---- */
const CRC32_TABLE = (function(){
  const table = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes){
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

/* ---- Écriture ZIP minimale (méthode "stored", sans compression) ---- */
function u16le(n){ return [n & 0xFF, (n>>8) & 0xFF]; }
function u32le(n){ return [n & 0xFF, (n>>8) & 0xFF, (n>>16) & 0xFF, (n>>24) & 0xFF]; }
function strToBytes(s){ const b = new Array(s.length); for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i) & 0xFF; return b; }
// Encodage UTF-8 correct (indispensable pour les accents français dans le XML) —
// strToBytes() ci-dessus ne convient qu'aux noms de fichiers ZIP, purement ASCII.
function utf8Bytes(str){
  const bytes = [];
  for(let i=0;i<str.length;i++){
    let code = str.codePointAt(i);
    if(code > 0xFFFF) i++; // caractère sur paire de substituts (emoji, etc.)
    if(code < 0x80){
      bytes.push(code);
    } else if(code < 0x800){
      bytes.push(0xC0 | (code>>6), 0x80 | (code&0x3F));
    } else if(code < 0x10000){
      bytes.push(0xE0 | (code>>12), 0x80 | ((code>>6)&0x3F), 0x80 | (code&0x3F));
    } else {
      bytes.push(0xF0 | (code>>18), 0x80 | ((code>>12)&0x3F), 0x80 | ((code>>6)&0x3F), 0x80 | (code&0x3F));
    }
  }
  return bytes;
}

function buildZip(files){
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  const dosTime = 0, dosDate = 0x21; // horodatage arbitraire (peu importe pour Excel)

  files.forEach(f => {
    const nameBytes = strToBytes(f.name);
    const dataBytes = (typeof f.data === "string") ? new Uint8Array(utf8Bytes(f.data)) : f.data;
    const crc = crc32(dataBytes);
    const size = dataBytes.length;

    const localHeader = new Uint8Array([
      ...u32le(0x04034b50), ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(dosTime), ...u16le(dosDate),
      ...u32le(crc), ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0),
    ]);
    const localEntry = new Uint8Array(localHeader.length + nameBytes.length + dataBytes.length);
    localEntry.set(localHeader, 0);
    localEntry.set(nameBytes, localHeader.length);
    localEntry.set(dataBytes, localHeader.length + nameBytes.length);
    localParts.push(localEntry);

    const centralHeader = new Uint8Array([
      ...u32le(0x02014b50), ...u16le(20), ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(dosTime), ...u16le(dosDate),
      ...u32le(crc), ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0), ...u16le(0),
      ...u16le(0), ...u16le(0), ...u32le(0),
      ...u32le(offset),
    ]);
    const centralEntry = new Uint8Array(centralHeader.length + nameBytes.length);
    centralEntry.set(centralHeader, 0);
    centralEntry.set(nameBytes, centralHeader.length);
    centralParts.push(centralEntry);

    offset += localEntry.length;
  });

  const centralSize = centralParts.reduce((s,p)=>s+p.length, 0);
  const centralOffset = offset;
  const eocd = new Uint8Array([
    ...u32le(0x06054b50), ...u16le(0), ...u16le(0),
    ...u16le(files.length), ...u16le(files.length),
    ...u32le(centralSize), ...u32le(centralOffset), ...u16le(0),
  ]);

  const total = offset + centralSize + eocd.length;
  const result = new Uint8Array(total);
  let pos = 0;
  localParts.forEach(p => { result.set(p, pos); pos += p.length; });
  centralParts.forEach(p => { result.set(p, pos); pos += p.length; });
  result.set(eocd, pos);
  return result;
}

/* ---- Lecture ZIP (entrées "stored" uniquement — voir parseXlsxWorkbook) ---- */
function readU16(bytes, off){ return bytes[off] | (bytes[off+1]<<8); }
function readU32(bytes, off){ return (bytes[off] | (bytes[off+1]<<8) | (bytes[off+2]<<16) | (bytes[off+3]<<24)) >>> 0; }
function bytesToStr(bytes){ let s=""; for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]); return s; }

function unzipStored(bytes){
  let eocdOff = -1;
  const searchStart = Math.max(0, bytes.length - 22 - 65557);
  for(let i=bytes.length-22; i>=searchStart; i--){
    if(readU32(bytes,i) === 0x06054b50){ eocdOff = i; break; }
  }
  if(eocdOff === -1) throw new Error("Archive ZIP invalide (fin introuvable).");
  const totalEntries = readU16(bytes, eocdOff+10);
  const centralDirOffset = readU32(bytes, eocdOff+16);

  const entries = [];
  let off = centralDirOffset;
  for(let i=0;i<totalEntries;i++){
    if(readU32(bytes, off) !== 0x02014b50) break;
    const method = readU16(bytes, off+10);
    const compSize = readU32(bytes, off+20);
    const uncompSize = readU32(bytes, off+24);
    const nameLen = readU16(bytes, off+28);
    const extraLen = readU16(bytes, off+30);
    const commentLen = readU16(bytes, off+32);
    const localHeaderOffset = readU32(bytes, off+42);
    const name = bytesToStr(bytes.slice(off+46, off+46+nameLen));
    entries.push({ name, method, compSize, uncompSize, localHeaderOffset });
    off += 46 + nameLen + extraLen + commentLen;
  }

  const hasCompressed = entries.some(e => e.method !== 0);
  if(hasCompressed){
    throw new Error("COMPRESSED");
  }

  const files = {};
  entries.forEach(e => {
    const lo = e.localHeaderOffset;
    if(readU32(bytes, lo) !== 0x04034b50) return;
    const nameLen = readU16(bytes, lo+26);
    const extraLen = readU16(bytes, lo+28);
    const dataStart = lo + 30 + nameLen + extraLen;
    files[e.name] = bytes.slice(dataStart, dataStart + e.compSize);
  });
  return files;
}

/* ---- Génération des parties XML (Office Open XML) ---- */
function colLetter(n){
  let s = "", num = n+1;
  while(num > 0){
    const rem = (num-1) % 26;
    s = String.fromCharCode(65+rem) + s;
    num = Math.floor((num-1)/26);
  }
  return s;
}
function xlsxCell(colIdx, rowNum, cell){
  const ref = colLetter(colIdx) + rowNum;
  if(cell.isNumber){
    return `<c r="${ref}"><v>${Number(cell.value)||0}</v></c>`;
  }
  const val = cell.value === undefined || cell.value === null ? "" : String(cell.value);
  if(val === "") return `<c r="${ref}"/>`;
  return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(val)}</t></is></c>`;
}
function xlsxSheetXml(rows){
  const rowsXml = rows.map((cells, i) => {
    const rowNum = i+1;
    const cellsXml = cells.map((c, ci) => xlsxCell(ci, rowNum, c)).join("");
    return `<row r="${rowNum}">${cellsXml}</row>`;
  }).join("");
  const nCols = rows.reduce((m,r) => Math.max(m, r.length), 1);
  const cols = `<cols>${`<col min="1" max="${nCols}" width="22" customWidth="1"/>`}</cols>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${rowsXml}</sheetData></worksheet>`;
}
function xlsxContentTypesXml(nSheets){
  let overrides = `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`;
  for(let i=1;i<=nSheets;i++) overrides += `<Override PartName="/xl/worksheets/sheet${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${overrides}</Types>`;
}
function xlsxRootRelsXml(){
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
}
function xlsxWorkbookXml(sheetNames){
  const tags = sheetNames.map((name,i) => `<sheet name="${esc(name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${tags}</sheets></workbook>`;
}
function xlsxWorkbookRelsXml(nSheets){
  let rels = "";
  for(let i=1;i<=nSheets;i++) rels += `<Relationship Id="rId${i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i}.xml"/>`;
  rels += `<Relationship Id="rId${nSheets+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`;
}
function xlsxStylesXml(){
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
}

const XLSX_SHEET_NAMES = ["Paramètres","Barème","Élèves","Paiements","Journal","Archives"];

async function buildXlsxWorkbook(d){
  const T = (v) => ({value:v});
  const N = (v) => ({value:v, isNumber:true});

  const paramRows = [
    [T("Nom de l'école"), T(d.ecole.nom)],
    [T("Adresse"), T(d.ecole.adresse)],
    [T("Téléphone"), T(d.ecole.telephone)],
    [T("Email"), T(d.ecole.email)],
    [T("Année scolaire"), T(d.ecole.anneeScolaire)],
    [T("Version de l'application"), T(APP_VERSION)],
  ];

  const baremeRows = [
    [T("ID"),T("Option"),T("Tarif T1"),T("Tarif T2"),T("Tarif T3"),T("Tarif Enseignant T1"),T("Tarif Enseignant T2"),T("Tarif Enseignant T3")],
    ...d.bareme.map(b => [T(b.id),T(b.option),N(b.t1),N(b.t2),N(b.t3),N(b.ens1),N(b.ens2),N(b.ens3)])
  ];

  const elevesRows = [
    [T("ID"),T("Nom"),T("Post-nom"),T("Prénom"),T("Sexe"),T("Classe"),T("Option"),T("Statut"),T("Archivé"),T("Motif archivage")],
    ...d.eleves.map(e => [T(e.id),T(e.nom),T(e.postnom),T(e.prenom),T(e.sexe),T(e.classe),T(e.option),T(e.statut),T(e.archive?"1":"0"),T(e.archiveMotif||"")])
  ];

  const paiementsRows = [
    [T("Numéro"),T("ID"),T("ID Élève"),T("Trimestre"),T("Date"),T("Montant"),T("Payeur"),T("Observation"),T("Annulé"),T("Motif annulation")],
    ...d.paiements.map(p => [N(p.numero||0),T(p.id),T(p.eleveId),N(p.trimestre),T(p.date),N(p.montant),T(p.payeur),T(p.obs),T(p.annule?"1":"0"),T(p.motifAnnulation||"")])
  ];

  const journalRows = [[T(JSON.stringify(d.journal || []))]];
  const archivesRows = [[T(JSON.stringify(d.archives || {}))]];

  const sheetsData = [paramRows, baremeRows, elevesRows, paiementsRows, journalRows, archivesRows];
  const nSheets = XLSX_SHEET_NAMES.length;

  const files = [
    { name: "[Content_Types].xml", data: xlsxContentTypesXml(nSheets) },
    { name: "_rels/.rels", data: xlsxRootRelsXml() },
    { name: "xl/workbook.xml", data: xlsxWorkbookXml(XLSX_SHEET_NAMES) },
    { name: "xl/_rels/workbook.xml.rels", data: xlsxWorkbookRelsXml(nSheets) },
    { name: "xl/styles.xml", data: xlsxStylesXml() },
  ];
  sheetsData.forEach((rows, i) => {
    files.push({ name: `xl/worksheets/sheet${i+1}.xml`, data: xlsxSheetXml(rows) });
  });

  return await buildZip(files);
}

/* ---- Lecture d'un .xlsx (relit ses propres fichiers ; voir limite ci-dessous) ---- */
function parseXlsxSheetXml(xml){
  const rows = [];
  const rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g;
  let rm;
  while((rm = rowRe.exec(xml))){
    const rowXml = rm[1];
    const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let cm;
    const byCol = {};
    let maxCol = -1;
    while((cm = cellRe.exec(rowXml))){
      const attrs = cm[1] || "";
      const inner = cm[2] || "";
      const refMatch = attrs.match(/r="([A-Z]+)(\d+)"/);
      if(!refMatch) continue;
      const colIdx = xlsxColToIndex(refMatch[1]);
      const typeMatch = attrs.match(/t="([^"]+)"/);
      let value = "";
      if(typeMatch && typeMatch[1] === "inlineStr"){
        const tMatch = inner.match(/<t[^>]*>([\s\S]*?)<\/t>/);
        value = tMatch ? xmlUnescapeText(tMatch[1]) : "";
      } else {
        const vMatch = inner.match(/<v>([\s\S]*?)<\/v>/);
        value = vMatch ? vMatch[1] : "";
      }
      byCol[colIdx] = value;
      if(colIdx > maxCol) maxCol = colIdx;
    }
    const arr = [];
    for(let i=0;i<=maxCol;i++) arr.push(byCol[i] !== undefined ? byCol[i] : "");
    rows.push(arr);
  }
  return rows;
}
function xlsxColToIndex(letters){
  let idx = 0;
  for(let i=0;i<letters.length;i++) idx = idx*26 + (letters.charCodeAt(i) - 64);
  return idx - 1;
}
function xmlUnescapeText(s){
  return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
}

// Limite assumée : on relit les feuilles dans l'ordre fixe où l'application les
// écrit (Paramètres, Barème, Élèves, Paiements, Journal, Archives). Si le
// classeur a été réenregistré depuis Excel avec compression, ou si les
// feuilles ont été réordonnées manuellement, la lecture peut échouer —
// dans ce cas, un message clair l'explique plutôt que de risquer une
// lecture incorrecte des données financières.
async function parseXlsxWorkbook(bytes){
  let files;
  try{
    files = await unzipStored(bytes);
  }catch(e){
    if(e.message === "COMPRESSED") return { error: "compressed" };
    return null;
  }

  const sheetsXml = [];
  for(let i=1;i<=XLSX_SHEET_NAMES.length;i++){
    const name = `xl/worksheets/sheet${i}.xml`;
    if(!files[name]) return null;
    sheetsXml.push(new TextDecoder("utf-8").decode(files[name]));
  }
  const [paramRows, baremeRows, elevesRows, paiementsRows, journalRows, archivesRows] = sheetsXml.map(parseXlsxSheetXml);

  const ecole = { nom:"", adresse:"", telephone:"", email:"", anneeScolaire:"" };
  const map = { "Nom de l'école":"nom", "Adresse":"adresse", "Téléphone":"telephone", "Email":"email", "Année scolaire":"anneeScolaire" };
  paramRows.forEach(r => { if(map[r[0]]) ecole[map[r[0]]] = r[1] || ""; });

  const bareme = baremeRows.slice(1).filter(r=>r[0]).map(r => ({
    id: r[0], option: r[1]||"",
    t1: Number(r[2])||0, t2: Number(r[3])||0, t3: Number(r[4])||0,
    ens1: Number(r[5])||0, ens2: Number(r[6])||0, ens3: Number(r[7])||0,
  }));

  const eleves = elevesRows.slice(1).filter(r=>r[0] && r[1]).map(r => ({
    id: r[0], nom: r[1]||"", postnom: r[2]||"", prenom: r[3]||"",
    sexe: r[4]||"M", classe: r[5]||"", option: r[6]||"", statut: r[7]||"Normal",
    archive: r[8] === "1", archiveMotif: r[9]||"",
  }));

  const paiements = paiementsRows.slice(1).filter(r=>r[1]).map(r => ({
    numero: Number(r[0])||0, id: r[1], eleveId: r[2]||"", trimestre: Number(r[3])||1, date: r[4]||"",
    montant: Number(r[5])||0, payeur: r[6]||"", obs: r[7]||"",
    annule: r[8] === "1", motifAnnulation: r[9]||"",
  }));

  let journal = [];
  try{ if(journalRows[0] && journalRows[0][0]) journal = JSON.parse(journalRows[0][0]); }catch(e){}
  let archives = {};
  try{ if(archivesRows[0] && archivesRows[0][0]) archives = JSON.parse(archivesRows[0][0]); }catch(e){}

  if(bareme.length===0 && eleves.length===0 && paiements.length===0 && !ecole.nom) return null;
  return { ecole, bareme, eleves, paiements, journal, archives };
}

function buildExcelWorkbook(d){
  const infoRows = [
    xmlRow([["String","Nom de l'école"],["String", d.ecole.nom]]),
    xmlRow([["String","Adresse"],["String", d.ecole.adresse]]),
    xmlRow([["String","Téléphone"],["String", d.ecole.telephone]]),
    xmlRow([["String","Email"],["String", d.ecole.email]]),
    xmlRow([["String","Année scolaire"],["String", d.ecole.anneeScolaire]]),
    xmlRow([["String","Version de l'application"],["String", APP_VERSION]]),
  ];

  const baremeRows = [
    xmlRow([["String","ID"],["String","Option"],["String","Tarif T1"],["String","Tarif T2"],["String","Tarif T3"],
             ["String","Tarif Enseignant T1"],["String","Tarif Enseignant T2"],["String","Tarif Enseignant T3"]]),
    ...d.bareme.map(r => xmlRow([
      ["String", r.id], ["String", r.option],
      ["Number", r.t1], ["Number", r.t2], ["Number", r.t3],
      ["Number", r.ens1], ["Number", r.ens2], ["Number", r.ens3],
    ]))
  ];

  const elevesRows = [
    xmlRow([["String","ID"],["String","Nom"],["String","Post-nom"],["String","Prénom"],["String","Sexe"],
             ["String","Classe"],["String","Option"],["String","Statut"],
             ["String","Archivé"],["String","Motif archivage"]]),
    ...d.eleves.map(e => xmlRow([
      ["String", e.id], ["String", e.nom], ["String", e.postnom], ["String", e.prenom],
      ["String", e.sexe], ["String", e.classe], ["String", e.option], ["String", e.statut],
      ["String", e.archive ? "1" : "0"], ["String", e.archiveMotif || ""],
    ]))
  ];

  const paiementsRows = [
    xmlRow([["String","Numéro"],["String","ID"],["String","ID Élève"],["String","Trimestre"],["String","Date"],
             ["String","Montant"],["String","Payeur"],["String","Observation"],
             ["String","Annulé"],["String","Motif annulation"]]),
    ...d.paiements.map(p => xmlRow([
      ["Number", p.numero||0], ["String", p.id], ["String", p.eleveId], ["Number", p.trimestre], ["String", p.date],
      ["Number", p.montant], ["String", p.payeur], ["String", p.obs],
      ["String", p.annule ? "1" : "0"], ["String", p.motifAnnulation || ""],
    ]))
  ];

  const journalRows = [ xmlRow([["String", JSON.stringify(d.journal || [])]]) ];
  const archivesRows = [ xmlRow([["String", JSON.stringify(d.archives || {})]]) ];

  return `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="${SS_NS}" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="${SS_NS}" xmlns:html="http://www.w3.org/TR/REC-html40">
${xmlSheet("Info", infoRows)}
${xmlSheet("Barème", baremeRows)}
${xmlSheet("Élèves", elevesRows)}
${xmlSheet("Paiements", paiementsRows)}
${xmlSheet("Journal", journalRows)}
${xmlSheet("Archives", archivesRows)}
</Workbook>`;
}

async function exportExcel(){
  const bytes = await buildXlsxWorkbook(state.data);
  const blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "REGISTRE_FRAIS_" + (state.data.ecole.anneeScolaire||"").replace(/[^\w-]/g,"") + ".xlsx";
  a.click();
  URL.revokeObjectURL(url);
}

function cellText(cell){
  if(!cell) return "";
  const data = cell.getElementsByTagNameNS(SS_NS, "Data")[0];
  return data ? (data.textContent || "").trim() : "";
}

function sheetToRows(doc, name){
  const sheets = doc.getElementsByTagNameNS(SS_NS, "Worksheet");
  let target = null;
  for(let i=0;i<sheets.length;i++){
    if(sheets[i].getAttributeNS(SS_NS, "Name") === name){ target = sheets[i]; break; }
  }
  if(!target) return [];
  const rows = target.getElementsByTagNameNS(SS_NS, "Row");
  const out = [];
  for(let i=0;i<rows.length;i++){
    const cells = rows[i].getElementsByTagNameNS(SS_NS, "Cell");
    const vals = [];
    for(let j=0;j<cells.length;j++) vals.push(cellText(cells[j]));
    out.push(vals);
  }
  return out;
}

function parseExcelWorkbook(text){
  const doc = new DOMParser().parseFromString(text, "text/xml");
  if(doc.getElementsByTagName("parsererror").length) return null;

  const infoRows = sheetToRows(doc, "Info");
  const ecole = { nom:"", adresse:"", telephone:"", email:"", anneeScolaire:"" };
  const map = { "Nom de l'école":"nom", "Adresse":"adresse", "Téléphone":"telephone", "Email":"email", "Année scolaire":"anneeScolaire" };
  infoRows.forEach(r => { if(map[r[0]]) ecole[map[r[0]]] = r[1] || ""; });

  const baremeRows = sheetToRows(doc, "Barème").slice(1);
  const bareme = baremeRows.filter(r=>r[0]).map(r => ({
    id: r[0] || uid("opt"), option: r[1] || "",
    t1: Number(r[2])||0, t2: Number(r[3])||0, t3: Number(r[4])||0,
    ens1: Number(r[5])||0, ens2: Number(r[6])||0, ens3: Number(r[7])||0,
  }));

  const elevesRows = sheetToRows(doc, "Élèves").slice(1);
  const eleves = elevesRows.filter(r=>r[0] && r[1]).map(r => ({
    id: r[0] || uid("el"), nom: r[1]||"", postnom: r[2]||"", prenom: r[3]||"",
    sexe: r[4]||"M", classe: r[5]||"", option: r[6]||"", statut: r[7]||"Normal",
    archive: r[8] === "1", archiveMotif: r[9] || "",
  }));

  const paiementsRows = sheetToRows(doc, "Paiements").slice(1);
  const paiements = paiementsRows.filter(r=>r[1]).map(r => ({
    numero: Number(r[0])||0, id: r[1] || uid("pay"), eleveId: r[2]||"", trimestre: Number(r[3])||1, date: r[4]||"",
    montant: Number(r[5])||0, payeur: r[6]||"", obs: r[7]||"",
    annule: r[8] === "1", motifAnnulation: r[9] || "",
  }));

  let journal = [];
  try{
    const journalRows = sheetToRows(doc, "Journal");
    if(journalRows[0] && journalRows[0][0]) journal = JSON.parse(journalRows[0][0]);
  }catch(e){ journal = []; }

  let archives = {};
  try{
    const archivesRows = sheetToRows(doc, "Archives");
    if(archivesRows[0] && archivesRows[0][0]) archives = JSON.parse(archivesRows[0][0]);
  }catch(e){ archives = {}; }

  if(bareme.length===0 && eleves.length===0 && paiements.length===0 && !ecole.nom) return null;
  return { ecole, bareme, eleves, paiements, journal, archives };
}

document.getElementById("import-input").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const bytes = new Uint8Array(reader.result);
      const result = await parseAnyWorkbook(bytes);
      if(result.error){ await showAlert(result.error); e.target.value=""; return; }

      state.data = { ...state.data, ...result.data };
      journalAdd("Import classeur", `Copie importée depuis ${file.name}`);
      saveData(); render();
      await showAlert("Données importées avec succès.");
    }catch(err){
      console.error(err);
      await showAlert("Une erreur est survenue pendant l'import de ce fichier.");
    }
    e.target.value = "";
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
});

/* ---------------- Authentification (nom d'utilisateur + mot de passe) ---------------- */
// Important : ces comptes sont stockés localement sur CET appareil/navigateur (jamais
// dans le classeur partagé), pour ne pas exposer de mots de passe dans un fichier Excel
// consultable par d'autres. Chaque poste de travail a donc ses propres comptes à créer.
const AUTH_USERS_KEY = "suivi-frais-scolaires-auth-users";
const AUTH_SESSION_KEY = "suivi-frais-scolaires-session";

async function hashPassword(pw){
  try{
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    // repli très simple si l'API de chiffrement n'est pas disponible (navigateur ancien)
    let h = 0;
    for(let i=0;i<pw.length;i++){ h = ((h<<5)-h) + pw.charCodeAt(i); h |= 0; }
    return "fallback-" + h;
  }
}

function loadAuthUsers(){
  try{ return JSON.parse(localStorage.getItem(AUTH_USERS_KEY)) || []; }
  catch(e){ return []; }
}
function saveAuthUsers(users){
  try{ localStorage.setItem(AUTH_USERS_KEY, JSON.stringify(users)); }catch(e){}
}
function getSession(){
  try{ return sessionStorage.getItem(AUTH_SESSION_KEY) || localStorage.getItem(AUTH_SESSION_KEY) || ""; }catch(e){ return ""; }
}
function setSession(username, remember){
  try{
    if(username){
      sessionStorage.setItem(AUTH_SESSION_KEY, username);
      if(remember) localStorage.setItem(AUTH_SESSION_KEY, username);
      else localStorage.removeItem(AUTH_SESSION_KEY);
    } else {
      sessionStorage.removeItem(AUTH_SESSION_KEY);
      localStorage.removeItem(AUTH_SESSION_KEY);
    }
  }catch(e){}
}

   Permet de transformer ce même fichier .html en un gabarit
   distribuable à d'autres écoles : au tout premier lancement sur un
   appareil (aucune donnée locale), l'utilisateur renseigne le nom
   de l'école, son logo et son barème de frais — au lieu de devoir
   modifier SEED_DATA à la main dans le code source pour chaque
   nouvelle école cliente. */
function schoolLogo(){
  return (state.data.ecole && state.data.ecole.logo) || LOGO_DATA;
}

function renderSetupWizard(step, error){
  document.getElementById("app").innerHTML = setupWizardHtml(step, error);
  const logoInput = document.getElementById("wiz-logo-input");
  if(logoInput) logoInput.addEventListener("change", onWizardLogoChange);
}

function setupWizardHtml(step, error){
  const d = state.data;
  const stepsOrder = ["ecole", "bareme"];
  const stepIndex = stepsOrder.indexOf(step);

  const leftPanel = `
    <div class="auth-left" style="background-image:url('${LOGIN_BG_DATA}');">
      <div class="auth-left-overlay"></div>
      <div class="auth-left-content">
        <div>
          <img src="${schoolLogo()}" style="width:76px;height:76px;object-fit:contain;margin-bottom:14px;">
          <div style="font-family:Georgia,serif;font-size:24px;font-weight:bold;color:white;letter-spacing:.02em;line-height:1.25;">${esc((d.ecole.nom||"NOUVELLE ÉCOLE").toUpperCase())}</div>
          <div style="height:2px;width:56px;background:var(--gold);margin:16px 0;"></div>
          <div style="font-size:19px;font-weight:600;color:white;letter-spacing:.04em;">CONFIGURATION INITIALE</div>
          <div style="font-size:13px;color:rgba(255,255,255,.8);margin-top:8px;max-width:340px;line-height:1.5;">
            Quelques informations avant de démarrer — cette étape ne se fera qu'une seule fois sur cet appareil.
          </div>
        </div>
        <div style="margin-top:36px;display:flex;flex-direction:column;gap:14px;">
          ${["École (nom, logo)","Barème des frais"].map((label,i) => `
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex-shrink:0;
                ${i<stepIndex ? "background:var(--paid);color:white;" : i===stepIndex ? "background:var(--gold);color:white;" : "background:rgba(255,255,255,.15);color:rgba(255,255,255,.6);"}">
                ${i<stepIndex ? "✓" : i+1}
              </div>
              <div style="font-size:13px;color:${i===stepIndex?'white':'rgba(255,255,255,.6)'};font-weight:${i===stepIndex?'600':'400'};">${label}</div>
            </div>
          `).join("")}
        </div>
      </div>
    </div>`;

  let rightInner = "";
  if(step === "ecole"){
    rightInner = `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px;">
        ${authIcon("info",44)}
        <div>
          <div style="font-family:Georgia,serif;font-size:22px;font-weight:bold;color:var(--ink);">Votre école</div>
          <div style="font-size:12.5px;opacity:.6;margin-top:2px;">Ces informations apparaîtront sur les reçus et rapports</div>
        </div>
      </div>
      ${error ? `<div style="background:#A6432E15;color:var(--late);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:16px;">${esc(error)}</div>` : ""}
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;gap:14px;align-items:center;">
          <img id="wiz-logo-preview" src="${schoolLogo()}" style="width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:10px;padding:4px;flex-shrink:0;">
          <div>
            <input type="file" id="wiz-logo-input" accept="image/*" style="display:none;">
            <button type="button" class="btn btn-outline" style="border-color:var(--line);color:var(--ink);font-size:12px;padding:7px 12px;" onclick="document.getElementById('wiz-logo-input').click()">📷 Choisir un logo</button>
            <div style="font-size:11px;opacity:.55;margin-top:4px;">Facultatif — un logo par défaut sera utilisé sinon.</div>
          </div>
        </div>
        <div>
          <div style="font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;">Nom de l'école *</div>
          <div class="auth-field"><input id="wiz-nom" value="${esc(d.ecole.nom)}" placeholder="ex : Institut Nguizani"></div>
        </div>
        <div>
          <div style="font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;">Adresse</div>
          <div class="auth-field"><input id="wiz-adresse" value="${esc(d.ecole.adresse)}" placeholder="ex : Mbanza-Ngungu"></div>
        </div>
        <div style="display:flex;gap:10px;">
          <div style="flex:1;">
            <div style="font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;">Téléphone</div>
            <div class="auth-field"><input id="wiz-telephone" value="${esc(d.ecole.telephone)}" placeholder="+243 ..."></div>
          </div>
          <div style="flex:1;">
            <div style="font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;">Email</div>
            <div class="auth-field"><input id="wiz-email" value="${esc(d.ecole.email)}" placeholder="contact@ecole.cd"></div>
          </div>
        </div>
        <div>
          <div style="font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;">Année scolaire</div>
          <div class="auth-field"><input id="wiz-annee" value="${esc(d.ecole.anneeScolaire)}" placeholder="ex : 2026-2027"></div>
        </div>
        <button class="btn" style="justify-content:center;padding:12px;font-size:14.5px;margin-top:8px;" onclick="submitWizardEcole()">Continuer →</button>
      </div>`;
  } else if(step === "bareme"){
    const rows = d.bareme.map((b,i) => `
      <tr>
        <td>${esc(b.option)}</td>
        <td class="right">${money(b.t1)}</td>
        <td class="right">${money(b.t2)}</td>
        <td class="right">${money(b.t3)}</td>
        <td class="right"><button class="icon-btn" onclick="removeWizardBareme(${i})">🗑️</button></td>
      </tr>`).join("");
    rightInner = `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
        ${authIcon("chart",44)}
        <div>
          <div style="font-family:Georgia,serif;font-size:22px;font-weight:bold;color:var(--ink);">Barème des frais</div>
          <div style="font-size:12.5px;opacity:.6;margin-top:2px;">Ajoutez au moins une option (classe/filière) — vous pourrez toujours en ajouter plus tard</div>
        </div>
      </div>
      ${d.bareme.length ? `
        <div class="table-wrap" style="margin-bottom:14px;"><table>
          <thead><tr><th>Option</th><th class="right">T1</th><th class="right">T2</th><th class="right">T3</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      ` : `<p style="font-size:12px;opacity:.55;margin-bottom:14px;">Aucune option ajoutée pour l'instant.</p>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
        <input id="wiz-bareme-option" placeholder="Option (ex : CG)" style="flex:1;min-width:100px;">
        <input id="wiz-bareme-t1" type="number" placeholder="T1" style="width:80px;">
        <input id="wiz-bareme-t2" type="number" placeholder="T2" style="width:80px;">
        <input id="wiz-bareme-t3" type="number" placeholder="T3" style="width:80px;">
        <button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="addWizardBareme()">➕ Ajouter</button>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" style="flex:1;justify-content:center;padding:12px;border-color:var(--line);color:var(--ink);" onclick="renderSetupWizard('ecole')">← Retour</button>
        <button class="btn" style="flex:2;justify-content:center;padding:12px;font-size:14.5px;" onclick="submitWizardBareme()">Terminer la configuration ✓</button>
      </div>
      <div style="font-size:11px;opacity:.5;margin-top:10px;text-align:center;">Vous pouvez continuer sans barème et le configurer plus tard depuis la page « Barème ».</div>`;
  }

  return `
    <div class="auth-page">
      <div class="auth-card">
        ${leftPanel}
        <div class="auth-right"><div class="auth-right-inner">${rightInner}</div></div>
      </div>
    </div>`;
}

function onWizardLogoChange(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.data.ecole.logo = reader.result;
    saveData();
    const preview = document.getElementById("wiz-logo-preview");
    if(preview) preview.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function submitWizardEcole(){
  const nom = document.getElementById("wiz-nom").value.trim();
  if(!nom){ renderSetupWizard("ecole", "Le nom de l'école est obligatoire."); return; }
  state.data.ecole.nom = nom;
  state.data.ecole.adresse = document.getElementById("wiz-adresse").value.trim();
  state.data.ecole.telephone = document.getElementById("wiz-telephone").value.trim();
  state.data.ecole.email = document.getElementById("wiz-email").value.trim();
  state.data.ecole.anneeScolaire = document.getElementById("wiz-annee").value.trim();
  saveData();
  renderSetupWizard("bareme");
}

function addWizardBareme(){
  const option = document.getElementById("wiz-bareme-option").value.trim();
  const t1 = Number(document.getElementById("wiz-bareme-t1").value) || 0;
  const t2 = Number(document.getElementById("wiz-bareme-t2").value) || 0;
  const t3 = Number(document.getElementById("wiz-bareme-t3").value) || 0;
  if(!option) return;
  state.data.bareme.push({ id: uid("opt"), option, t1, t2, t3, ens1: Math.round(t1/2), ens2: Math.round(t2/2), ens3: Math.round(t3/2) });
  saveData();
  renderSetupWizard("bareme");
}

function removeWizardBareme(index){
  state.data.bareme.splice(index, 1);
  saveData();
  renderSetupWizard("bareme");
}

function submitWizardBareme(){
  state.data.ecole.configured = true;
  state.data.ecole._ecoleId = state.currentEcoleId;
  journalAdd("Configuration initiale de l'école", state.data.ecole.nom);
  saveData();
  initApp(firebase.auth().currentUser);
}

function renderAuthScreen(mode, error){
  document.getElementById("app").innerHTML = authScreenHtml(mode, error);
  const onEnter = (fn) => (e) => { if(e.key === "Enter") fn(); };
  if(mode === "forgot"){
    document.getElementById("fp-email").addEventListener("keydown", onEnter(submitForgotPassword));
    document.getElementById("fp-email").focus();
    return;
  }
  const pwField = document.getElementById("auth-password");
  if(pwField) pwField.addEventListener("keydown", onEnter(submitLogin));
  document.getElementById("auth-username").focus();
}

function generateRecoveryCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans caractères ambigus (0/O, 1/I...)
  let code = "";
  for(let i=0;i<12;i++){
    if(i>0 && i%4===0) code += "-";
    code += chars[Math.floor(Math.random()*chars.length)];
  }
  return code;
}

async function showRecoveryCodeOnce(code, username){
  await showModal({
    title: "🔑 Code de secours — à conserver précieusement",
    message:
      `Compte : ${username}\n\nVotre code de secours :\n\n${code}\n\n` +
      `Notez-le et gardez-le en lieu sûr (papier, gestionnaire de mots de passe...). ` +
      `C'est le SEUL moyen de récupérer l'accès en cas d'oubli du mot de passe. ` +
      `Il ne sera plus jamais affiché.`,
    confirmLabel: "J'ai noté ce code",
    alertOnly: true,
  });
}

async function submitLogin(){
  const email = document.getElementById("auth-username").value.trim();
  const pw = document.getElementById("auth-password").value;
  if(!email || !pw){ renderAuthScreen("login", "Veuillez renseigner votre e-mail et votre mot de passe."); return; }
  try{
    await firebase.auth().signInWithEmailAndPassword(email, pw);
    // La suite (chargement du profil, affichage de l'appli) est gérée
    // automatiquement par l'écouteur onAuthStateChanged plus bas.
  }catch(e){
    renderAuthScreen("login", "Connexion impossible : e-mail ou mot de passe incorrect.");
  }
}

async function submitForgotPassword(){
  const email = document.getElementById("fp-email").value.trim();
  if(!email){ renderAuthScreen("forgot", "Veuillez renseigner votre adresse e-mail."); return; }
  try{
    await firebase.auth().sendPasswordResetEmail(email);
    await showAlert("Un e-mail de réinitialisation a été envoyé à " + email + ". Vérifiez votre boîte de réception (et vos spams).");
    renderAuthScreen("login");
  }catch(e){
    renderAuthScreen("forgot", "Impossible d'envoyer l'e-mail : vérifiez l'adresse saisie.");
  }
}

function logout(){
  journalAdd("Déconnexion", getCurrentUser());
  saveData();
  firebase.auth().signOut();
  // L'écouteur onAuthStateChanged affichera automatiquement l'écran de connexion.
}

/* ---------------- Gestion des utilisateurs (comptes locaux) ---------------- */
function viewUtilisateurs(){
  const estAdmin = state.currentRole === "Admin";
  return `
    <div class="title-row"><div>
      <div class="eyebrow">Sécurité</div>
      <h1 class="serif">Mon compte</h1>
      <p class="subtitle">Connexion sécurisée par e-mail. Chaque enseignant a son propre compte, partagé entre tous ses appareils.</p>
    </div></div>

    <div class="table-wrap"><table>
      <thead><tr><th>E-mail</th><th>Rôle</th><th>Code reçu</th></tr></thead>
      <tbody><tr><td>${esc(getCurrentUser())}</td><td style="opacity:.7;">${estAdmin ? "Administrateur" : "Enseignant"}</td><td style="opacity:.7;">${esc(state.currentRecuCode||"—")}</td></tr></tbody>
    </table></div>
    <div style="font-size:11.5px;opacity:.6;margin-top:-10px;margin-bottom:16px;">Préfixe utilisé sur vos reçus (ex. ${esc(state.currentRecuCode||"RN")}-0014), pour qu'aucun numéro ne se répète entre enseignants. Non défini dans votre profil ? Un code est déduit automatiquement de votre e-mail.</div>

    <div class="form-card">
      <div class="form-title">Changer mon mot de passe</div>
      <div class="form-row">
        <div class="field"><label>Nouveau mot de passe</label><input id="cp-password" type="password"></div>
        <button class="btn" onclick="changeMyPassword()">🔑 Mettre à jour</button>
      </div>
    </div>

    ${estAdmin ? `
    <div class="form-card">
      <div class="form-title">Ajouter un nouvel enseignant</div>
      <div class="subtitle" style="margin-top:-6px;">
        La création de comptes se fait pour l'instant depuis la console Firebase (par mesure de sécurité) :<br>
        1. Firebase Console → Authentication → Ajouter un utilisateur (e-mail + mot de passe provisoire).<br>
        2. Copiez son identifiant (UID).<br>
        3. Firestore Database → Données → collection <code>users</code> → nouveau document avec cet UID, contenant <code>ecoleId: "nguizani"</code>, <code>role: "Enseignant"</code> (ou <code>"Admin"</code>), et <code>codeRecu: "XX"</code> (2-3 lettres, pour distinguer ses reçus — sinon un code est déduit automatiquement de son e-mail).
      </div>
    </div>` : ""}
  `;
}

async function changeMyPassword(){
  const pw = document.getElementById("cp-password").value;
  if(!pw || pw.length < 6){ await showAlert("Le mot de passe doit contenir au moins 6 caractères."); return; }
  try{
    await firebase.auth().currentUser.updatePassword(pw);
    journalAdd("Changement de mot de passe", getCurrentUser());
    saveData();
    await showAlert("Mot de passe mis à jour.");
    renderView();
  }catch(e){
    if(e.code === "auth/requires-recent-login"){
      await showAlert("Pour votre sécurité, veuillez vous déconnecter puis vous reconnecter avant de changer votre mot de passe.");
    } else {
      await showAlert("Erreur : " + (e.message||e));
    }
  }
}

/* ---------------- Démarrage : vérifie l'authentification avant d'afficher l'app ---------------- */
async function initApp(user){
  if(!user){
    renderAuthScreen("login");
    return;
  }
  // Utilisateur authentifié auprès de Firebase : on va chercher son profil
  // (ecoleId + rôle) dans Firestore avant d'afficher quoi que ce soit.
  let profil;
  try{
    const snap = await firebase.firestore().collection("users").doc(user.uid).get();
    if(!snap.exists){
      renderAuthScreen("login", "Compte authentifié, mais aucun profil n'est associé. Contactez l'administrateur de l'école.");
      return;
    }
    profil = snap.data();
  }catch(e){
    renderAuthScreen("login", "Erreur de connexion au serveur : " + (e.message||e));
    return;
  }
  state.currentUser = user.email;
  state.currentUserUid = user.uid;
  state.currentRole = (profil.role || "").trim();
  state.currentEcoleId = profil.ecoleId || "";
  state.currentRecuCode = (profil.codeRecu || deriveRecuCode(user.email)).toUpperCase();

  if(!state.currentEcoleId){
    renderAuthScreen("login", "Votre compte n'est associé à aucune école. Contactez l'administrateur.");
    return;
  }

  document.getElementById("app").innerHTML = `<div class="splash-loader"><div class="spinner"></div><div class="splash-text">Chargement des données de l'école…</div></div>`;

  let statut;
  try{
    statut = await loadFromFirestore(state.currentEcoleId);
  }catch(e){
    renderAuthScreen("login", "Erreur de chargement des données : " + (e.message||e));
    return;
  }

  if(statut === "nouvelle-ecole"){
    if(state.currentRole !== "Admin"){
      renderAuthScreen("login", `Cette école n'a pas encore été configurée. Contactez votre administrateur. (rôle détecté : "${state.currentRole}")`);
      return;
    }
    renderSetupWizard("ecole");
    return;
  }

  if(statut === "licence-expiree"){
    document.getElementById("app").innerHTML = `
      <div class="auth-page"><div class="auth-card"><div class="auth-right" style="width:100%;"><div class="auth-right-inner">
        <div style="font-family:Georgia,serif;font-size:20px;font-weight:bold;color:var(--late);margin-bottom:10px;">Licence expirée</div>
        <p style="font-size:13.5px;line-height:1.6;">L'abonnement de votre école à ce logiciel est arrivé à échéance. Contactez l'administrateur/développeur de l'application pour le renouveler.</p>
        <button class="btn btn-outline" style="margin-top:14px;" onclick="logout()">Se déconnecter</button>
      </div></div></div></div>`;
    return;
  }

  render();
  tryAutoReconnect();

  // Avertissement discret (non bloquant) si la licence expire dans moins de
  // 30 jours, visible seulement par l'administrateur de l'école.
  if(state.currentRole === "Admin" && state.licenceExpireLe){
    const joursRestants = Math.ceil((state.licenceExpireLe.getTime() - Date.now()) / 86400000);
    if(joursRestants <= 30){
      const bandeau = document.createElement("div");
      bandeau.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#A6432E;color:#fff;padding:8px 14px;font-size:12.5px;text-align:center;z-index:9999;";
      bandeau.textContent = joursRestants > 0
        ? `Licence de l'école : expire dans ${joursRestants} jour(s).`
        : "Licence de l'école : expirée.";
      document.body.appendChild(bandeau);
    }
  }
}

/* ---------------- démarrage ---------------- */
firebase.auth().onAuthStateChanged(initApp);
</script>
