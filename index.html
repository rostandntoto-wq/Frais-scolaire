<meta name="application-name" content="Registre des frais scolaires">
<style>
  :root{
    --ink:#1E2A4A;
    --paper:#FAF7EE;
    --gold:#B8863B;
    --paid:#2F6B4F;
    --late:#A6432E;
    --line:#DDD2B4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .serif{font-family:Georgia,"Times New Roman",serif;}
  #app{display:flex;min-height:100vh;flex-direction:column;}
  @media(min-width:860px){ #app{flex-direction:row;} }

  /* --- sidebar --- */
  #sidebar{
    background:var(--ink); color:var(--paper);
    display:flex; flex-direction:column;
    flex-shrink:0;
    position:sticky; top:0; z-index:30;
    max-height:100vh; overflow-y:auto;
  }
  @media(min-width:860px){ #sidebar{width:260px; min-height:100vh;} }
  .brand{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid #33456b;}
  .brand-badge{width:38px;height:38px;border-radius:8px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .brand-label{font-size:10px;text-transform:uppercase;letter-spacing:.2em;opacity:.6;}
  .brand-name{background:transparent;border:none;color:var(--paper);font-family:Georgia,serif;
    font-weight:600;font-size:14px;width:100%;outline:none;}
  nav{display:flex;gap:4px;padding:12px;overflow-x:auto;}
  @media(min-width:860px){ nav{flex-direction:column;} }
  .nav-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;
    background:transparent;color:var(--paper);border:none;font-size:14px;cursor:pointer;
    white-space:nowrap;text-align:left;flex-shrink:0;}
  .nav-btn.active{background:var(--gold);color:var(--ink);font-weight:600;}
  .sidebar-footer{padding:12px;border-top:1px solid #33456b;margin-top:auto;display:flex;flex-direction:column;gap:2px;}
  .side-link{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:transparent;
    border:none;color:var(--paper);opacity:.8;font-size:12px;cursor:pointer;text-align:left;}
  .side-link:hover{opacity:1;}
  .save-note{padding:8px 14px 4px;font-size:11px;opacity:.5;}

  /* --- main --- */
  main{flex:1;min-width:0;padding:20px;}
  @media(min-width:860px){ main{padding:44px;} }
  .wrap{max-width:920px;margin:0 auto;}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.25em;color:var(--gold);margin-bottom:4px;}
  h1{font-size:30px;margin:0 0 6px;}
  .subtitle{font-size:13px;opacity:.6;max-width:520px;margin:0 0 28px;}
  .title-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:24px;}

  /* --- cards / stats --- */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:36px;}
  @media(min-width:640px){ .stats-grid{grid-template-columns:repeat(4,1fr);} }
  .stat-card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;}
  .stat-value{font-family:Georgia,serif;font-size:24px;font-weight:600;}
  .stat-label{font-size:12px;opacity:.6;margin-top:4px;}

  /* --- tables --- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  .table-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px;}
  thead tr{background:rgba(30,42,74,0.05);}
  th{text-align:left;padding:11px 14px;font-weight:600;}
  th.right, td.right{text-align:right;}
  th.center, td.center{text-align:center;}
  td{padding:9px 14px;border-top:1px solid var(--line);}
  tbody tr:first-child td{border-top:1px solid var(--line);}

  /* --- forms --- */
  .form-card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:24px;}
  .form-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin-bottom:10px;}
  .form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field.wide{flex:1;min-width:170px;}
  .field label{font-size:11px;opacity:.5;}
  input,select{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:6px;background:var(--paper);color:var(--ink);outline:none;}
  input[type=number]{width:100px;}
  input.small{width:100px;}
  input.name{width:120px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:7px;
    border:none;background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;cursor:pointer;}
  .btn:hover{opacity:.92;}
  .btn-outline{background:transparent;border:1px solid var(--late);color:var(--late);}
  .icon-btn{background:none;border:none;cursor:pointer;opacity:.4;padding:4px;font-size:14px;}
  .icon-btn:hover{opacity:1;}

  .empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;}
  .empty .icon{font-size:26px;opacity:.4;margin-bottom:8px;}
  .empty .t{font-weight:600;}
  .empty .d{font-size:13px;opacity:.6;margin-top:4px;max-width:340px;margin-left:auto;margin-right:auto;}

  .warn{background:rgba(184,134,59,0.15);color:var(--ink);border-radius:8px;padding:12px 14px;
    font-size:13px;margin-bottom:20px;display:flex;gap:8px;align-items:center;}
  .search-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center;}
  .search-box{position:relative;flex:1;min-width:180px;max-width:280px;}
  .search-box input{width:100%;padding-left:28px;}
  .search-box::before{content:"🔍";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.5;}

  .pos{color:var(--paid);}
  .neg{color:var(--late);}

  /* --- print --- */
  #print-area{display:none;}
  @media print{
    #app{display:none !important;}
    #print-area{display:block !important;}
  }
  .receipt-page{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);
    width:100%;height:98vh;page-break-after:always;}
  .receipt-page:last-child{page-break-after:auto;}
  .receipt-cell{border:1px dashed #999;overflow:hidden;page-break-inside:avoid;}
  .check-col{width:28px;}
</style>
</head>

}

function saveData(){
  // Le stockage local peut être bloqué par le navigateur (ex: fichier ouvert en
  // double-clic). On protège TOUJOURS cet appel pour que l'affichage se
  // rafraîchisse malgré tout — sinon les boutons "semblent" ne rien faire.
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  }catch(e){
    // on ignore : le classeur lié (si présent) ou l'export manuel prennent le relais
  }
  syncToLinkedFile();
  updateSaveNote();
}

function updateSaveNote(){
  const note = document.getElementById("save-note");
  if(!note) return;
  if(linkedFileHandle){
    note.textContent = linkedFileStatus === "saving" ? ("Écriture dans " + linkedFileName + "…")
      : linkedFileStatus === "error" ? ("⚠️ Échec d'écriture dans " + linkedFileName)
      : linkedFileStatus === "conflict" ? ("⚠️ Conflit détecté sur " + linkedFileName)
      : ("Classeur lié : " + linkedFileName + " ✓");
  } else {
    note.textContent = "Registre à jour (navigateur)";
  }
}

/* ---------------- Liaison directe à un classeur Excel (File System Access API) ---------------- */
const FS_ACCESS_OK = "showSaveFilePicker" in window && "showOpenFilePicker" in window;

async function syncToLinkedFile(){
  if(!linkedFileHandle) return;
  linkedFileStatus = "saving";
  updateSaveNote();
  try{
    // Détection de conflit : si le fichier sur le disque a changé depuis notre
    // dernière lecture/écriture (ex : quelqu'un d'autre l'a modifié), on ne
    // l'écrase pas — on prévient plutôt que de perdre son travail.
    if(lastSyncedSnapshot !== null){
      const currentFile = await linkedFileHandle.getFile();
      const currentText = await currentFile.text();
      if(currentText !== lastSyncedSnapshot){
        linkedFileStatus = "conflict";
        updateSaveNote();
        render();
        return;
      }
    }
    const xml = buildExcelWorkbook(state.data);
    const writable = await linkedFileHandle.createWritable();
    await writable.write(xml);
    await writable.close();
    lastSyncedSnapshot = xml;
    linkedFileStatus = "saved";
  }catch(e){
    linkedFileStatus = "error";
    console.error("Échec d'écriture dans le classeur lié :", e);
  }
  updateSaveNote();
}

async function rechargerClasseurLie(){
  if(!linkedFileHandle) return;
  try{
    const file = await linkedFileHandle.getFile();
    const text = await file.text();
    const parsed = parseExcelWorkbook(text);
    if(!parsed){ alert("Le contenu du classeur n'a pas pu être relu."); return; }
    state.data = { ...state.data, ...parsed };
    lastSyncedSnapshot = text;
    linkedFileStatus = "saved";
    render();
    alert("Dernière version du classeur rechargée. Vos modifications non enregistrées ont été remplacées par le contenu du fichier.");
  }catch(e){
    alert("Impossible de relire le classeur lié.");
  }
}

async function creerClasseurLie(){
  if(!FS_ACCESS_OK){
    alert("Votre navigateur ne permet pas de lier un fichier directement (fonctionne sur Chrome ou Edge). Utilisez Exporter/Importer à la place.");
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: "frais-scolaires.xls",
      types: [{ description: "Classeur Excel", accept: { "application/vnd.ms-excel": [".xls"] } }]
    });
    linkedFileHandle = handle;
    linkedFileName = handle.name;
    lastSyncedSnapshot = null;
    await syncToLinkedFile();
    render();
  }catch(e){
    // sélection annulée par l'utilisateur — rien à faire
  }
}

async function ouvrirClasseurLie(){
  if(!FS_ACCESS_OK){
    alert("Votre navigateur ne permet pas de lier un fichier directement (fonctionne sur Chrome ou Edge). Utilisez Exporter/Importer à la place.");
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "Classeur Excel", accept: { "application/vnd.ms-excel": [".xls"], "text/xml": [".xml"] } }]
    });
    const perm = await handle.requestPermission({ mode: "readwrite" });
    if(perm !== "granted"){
      alert("Autorisation d'écriture refusée — le classeur ne peut pas être lié.");
      return;
    }
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = parseExcelWorkbook(text);
    if(!parsed){
      alert("Ce fichier n'a pas la structure attendue (feuilles Info / Barème / Élèves / Paiements). Utilisez un classeur déjà exporté par cette application.");
      return;
    }
    linkedFileHandle = handle;
    linkedFileName = handle.name;
    state.data = { ...state.data, ...parsed };
    lastSyncedSnapshot = text;
    saveData();
    render();
  }catch(e){
    // sélection annulée par l'utilisateur — rien à faire
  }
}

function delierClasseur(){
  linkedFileHandle = null;
  linkedFileName = "";
  linkedFileStatus = "";
  lastSyncedSnapshot = null;
  render();
}

/* ---------------- Mécanisme de mise à jour ---------------- */
function compareVersions(a, b){
  const pa = String(a).split(".").map(n => parseInt(n,10) || 0);
  const pb = String(b).split(".").map(n => parseInt(n,10) || 0);
  for(let i=0; i<Math.max(pa.length, pb.length); i++){
    const diff = (pa[i]||0) - (pb[i]||0);
    if(diff !== 0) return diff > 0 ? 1 : -1;
  }
  return 0;
}

async function checkForUpdates(){
  if(!UPDATE_CHECK_URL){
    alert(
      "La vérification des mises à jour n'est pas configurée sur cette installation.\n\n" +
      "Version actuelle : " + APP_VERSION + "\n\n" +
      "Pour l'activer, il faut héberger un petit fichier JSON décrivant la dernière version " +
      "et renseigner son adresse dans le code de l'application (constante UPDATE_CHECK_URL)."
    );
    return;
  }
  try{
    const res = await fetch(UPDATE_CHECK_URL, { cache: "no-store" });
    const info = await res.json();
    if(info && info.version && compareVersions(info.version, APP_VERSION) > 0){
      state.updateAvailable = info;
      render();
    } else {
      state.updateAvailable = null;
      alert("Vous utilisez déjà la dernière version (" + APP_VERSION + ").");
      render();
    }
  }catch(e){
    alert("Impossible de vérifier les mises à jour (pas de connexion internet, ou adresse invalide).");
  }
}

function uid(prefix){
  return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
}

function money(n){
  const v = Number(n) || 0;
  return v.toLocaleString("fr-FR") + " FC";
}

function receiptNumber(n){
  return "R" + String(n).padStart(4,"0");
}

function dateFr(iso){
  if(!iso) return "—";
  const parts = iso.split("-");
  if(parts.length !== 3) return iso;
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

function esc(s){
  if(s === undefined || s === null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function tarifPourEleve(bareme, eleve, trimestre){
  const row = bareme.find(b => b.option === eleve.option);
  if(!row) return 0;
  const enseignant = eleve.statut === "Enfant enseignant";
  const key = enseignant ? ("ens"+trimestre) : ("t"+trimestre);
  return Number(row[key]) || 0;
}

function duTotal(bareme, eleve){
  return [1,2,3].reduce((s,t) => s + tarifPourEleve(bareme, eleve, t), 0);
}

function classesUniques(eleves){
  const set = new Set(eleves.map(e => e.classe).filter(Boolean));
  return ["Toutes", ...set];
}

function classeOptionGroups(eleves){
  const map = new Map();
  eleves.forEach(e => {
    const classe = e.classe || "Sans classe";
    const option = e.option || "";
    const value = classe + "||" + option;
    const label = option ? `${classe} ${option}` : classe;
    if(!map.has(value)) map.set(value, label);
  });
  const groups = [...map.entries()].map(([value,label]) => ({value,label}));
  groups.sort((a,b) => a.label.localeCompare(b.label));
  return [{value:"Toutes", label:"Toutes"}, ...groups];
}

// Index paiements par élève — évite de rebalayer tout le tableau des paiements
// pour chaque élève (coûteux quand il y a beaucoup d'élèves ET de paiements).
function paiementsParEleve(paiements){
  const map = new Map();
  for(const p of paiements){
    let arr = map.get(p.eleveId);
    if(!arr){ arr = []; map.set(p.eleveId, arr); }
    arr.push(p);
  }
  return map;
}
function payeTotal(payMap, eleveId, trimestre){
  const arr = payMap.get(eleveId);
  if(!arr) return 0;
  let total = 0;
  for(const p of arr){
    if(p.annule) continue;
    if(trimestre && Number(p.trimestre) !== trimestre) continue;
    total += Number(p.montant||0);
  }
  return total;
}

function nextReceiptNumber(){
  return state.data.paiements.reduce((max,p) => Math.max(max, Number(p.numero)||0), 0) + 1;
}

/* ---------------- Journal d'activité (traçabilité) ---------------- */
const JOURNAL_MAX_ENTRIES = 3000;

function journalAdd(action, detail){
  if(!state.data.journal) state.data.journal = [];
  state.data.journal.push({
    id: uid("log"),
    ts: new Date().toISOString(),
    user: getCurrentUser(),
    action,
    detail: detail || "",
  });
  // on garde un historique borné pour ne pas alourdir indéfiniment le fichier
  if(state.data.journal.length > JOURNAL_MAX_ENTRIES){
    state.data.journal = state.data.journal.slice(state.data.journal.length - JOURNAL_MAX_ENTRIES);
  }
}

function formatDateTimeFr(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function eleveLabelNomPostnom(e){
  return `${e.nom} ${e.postnom||""}`.replace(/\s+/g," ").trim();
}
function eleveLabelFull(e){
  return `${e.nom} ${e.postnom||""} ${e.prenom||""}`.replace(/\s+/g," ").trim();
}
function eleveLabelWithClasse(e){
  const opt = e.option ? ` (${e.option})` : "";
  return `${eleveLabelFull(e)} — ${e.classe||""}${opt}`.trim();
}
function findEleveByTypedName(text){
  const t = (text||"").trim().toLowerCase();
  if(!t) return null;
  const eleves = state.data.eleves;
  let match = eleves.find(e => eleveLabelWithClasse(e).toLowerCase() === t);
  if(match) return match;
  match = eleves.find(e => eleveLabelFull(e).toLowerCase() === t);
  if(match) return match;
  const candidates = eleves.filter(e => eleveLabelWithClasse(e).toLowerCase().startsWith(t) || eleveLabelFull(e).toLowerCase().startsWith(t));
  return candidates.length === 1 ? candidates[0] : null;
}

/* ---------------- Tableau de bord (par trimestre) ---------------- */
function viewDashboard(){
  const d = state.data;
  const t = state.dashboardTrimestre;
  const elevesActifs = d.eleves.filter(e => !e.archive);
  const nbEleves = elevesActifs.length;
  const empty = nbEleves === 0;

  let attendu=0, encaisse=0, nbRetard=0;
  const parGroupe = {};
  const payMap = paiementsParEleve(d.paiements);

  elevesActifs.forEach(el => {
    const due = tarifPourEleve(d.bareme, el, t);
    const paye = payeTotal(payMap, el.id, t);
    attendu += due; encaisse += paye;
    if(paye < due) nbRetard++;
    const classe = el.classe || "Sans classe";
    const option = el.option || "Sans option";
    const key = classe + "|" + option;
    if(!parGroupe[key]) parGroupe[key] = {classe, option, due:0, paye:0, n:0};
    parGroupe[key].due += due; parGroupe[key].paye += paye; parGroupe[key].n++;
  });

  const retard = Math.max(0, attendu - encaisse);

  const dashboardClasseGroups = classeOptionGroups(elevesActifs);
  // Le calcul détaillé de "tous les élèves" est coûteux avec beaucoup de paiements —
  // on ne le fait que si la liste est effectivement affichée.
  const tousLesEleves = !state.dashboardShowAll ? [] : [...elevesActifs].filter(el => {
    if(state.dashboardEleveFiltre === "Toutes") return true;
    const groupValue = (el.classe||"Sans classe") + "||" + (el.option||"");
    return groupValue === state.dashboardEleveFiltre;
  }).sort((a,b) => {
    const c = (a.classe||"").localeCompare(b.classe||"");
    return c !== 0 ? c : (a.nom||"").localeCompare(b.nom||"");
  }).map(el => {
    const due = tarifPourEleve(d.bareme, el, t);
    const paye = payeTotal(payMap, el.id, t);
    return { el, due, paye, solde: due - paye };
  });

  const tousLesElevesRows = tousLesEleves.map(({el, due, paye, solde}) => `
    <tr>
      <td>${esc(el.nom)} ${esc(el.postnom)} ${esc(el.prenom)}</td>
      <td>${esc(el.classe)}</td>
      <td>${esc(el.option)}</td>
      <td class="right">${money(due)}</td>
      <td class="right pos">${money(paye)}</td>
      <td class="center">${solde<=0 ? '<span class="pos">✓ à jour</span>' : `<span class="neg">${money(solde)}</span>`}</td>
    </tr>`).join("");

  const archiveKeys = Object.keys(d.archives || {}).sort().reverse();
  const archiveRows = archiveKeys.map(annee => {
    const a = d.archives[annee];
    const totalEncaisse = (a.paiements||[]).filter(p=>!p.annule).reduce((s,p)=>s+Number(p.montant||0),0);
    return `<tr>
      <td>${esc(annee)}</td>
      <td class="right">${(a.eleves||[]).length}</td>
      <td class="right">${(a.paiements||[]).length}</td>
      <td class="right">${money(totalEncaisse)}</td>
    </tr>`;
  }).join("");

  const tabsHtml = [1,2,3].map(tt => `
    <button class="nav-btn" style="color:var(--ink);${tt===t?`background:var(--gold);font-weight:600;`:`background:white;border:1px solid var(--line);`}"
      onclick="setDashboardTrimestre(${tt})">Trimestre ${tt}</button>
  `).join("");

  const classeRows = Object.values(parGroupe).sort((a,b) => {
    const c = a.classe.localeCompare(b.classe);
    return c !== 0 ? c : a.option.localeCompare(b.option);
  }).map(c => {
    const taux = c.due>0 ? Math.round(c.paye/c.due*100) : 0;
    const label = c.option === "Sans option" ? c.classe : `${c.classe} ${c.option}`;
    return `<tr>
      <td>${esc(label)}</td><td class="right">${c.n}</td><td class="right">${money(c.due)}</td>
      <td class="right pos">${money(c.paye)}</td><td class="right">${taux}%</td>
      <td class="right"><button class="icon-btn" title="Imprimer" onclick="printClassList('${esc(c.classe)}', '${esc(c.option)}', ${t})">🖨️</button></td>
    </tr>`;
  }).join("");

  return `
    <div class="title-row">
      <div>
        <div class="eyebrow">Vue d'ensemble — Trimestre ${t}</div>
        <h1 class="serif">Tableau de bord</h1>
        <p class="subtitle">Suivi du recouvrement des frais scolaires pour le trimestre sélectionné.</p>
      </div>
      ${nbRetard>0 ? `<button class="btn btn-outline" onclick="printRetards(${t})">🖨️ Imprimer la liste des retards (T${t})</button>` : ""}
      <button class="btn" onclick="printAllEleves(${t})">🖨️ Imprimer la liste des élèves (T${t})</button>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:22px;">${tabsHtml}</div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value serif">${nbEleves}</div><div class="stat-label">Élèves</div></div>
      <div class="stat-card"><div class="stat-value serif">${money(attendu)}</div><div class="stat-label">Attendu — T${t}</div></div>
      <div class="stat-card"><div class="stat-value serif pos">${money(encaisse)}</div><div class="stat-label">Encaissé — T${t}</div></div>
      <div class="stat-card"><div class="stat-value serif ${retard>0?'neg':''}">${money(retard)}</div><div class="stat-label">En retard — T${t}</div></div>
    </div>

    ${empty ? emptyState("👥","Aucun élève enregistré","Ajoutez des élèves pour voir apparaître le tableau de bord.") : `
      <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:10px;">Recouvrement par classe et option — Trimestre ${t}</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Classe / Option</th><th class="right">Élèves</th><th class="right">Dû</th><th class="right">Encaissé</th><th class="right">Taux</th><th></th></tr></thead>
        <tbody>${classeRows}</tbody>
      </table></div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin:0;">Situation de tous les élèves — Trimestre ${t}</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${state.dashboardShowAll ? `
            <select onchange="onDashboardEleveFiltre(this.value)">
              ${dashboardClasseGroups.map(c=>`<option value="${esc(c.value)}" ${c.value===state.dashboardEleveFiltre?'selected':''}>${esc(c.label)}</option>`).join("")}
            </select>
            <button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="printAllEleves(${t}, state.dashboardEleveFiltre)">🖨️ Imprimer ce filtre</button>
          ` : ""}
          <button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="toggleDashboardShowAll()">${state.dashboardShowAll ? "Masquer" : "Afficher"}</button>
        </div>
      </div>
      ${state.dashboardShowAll ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Élève</th><th>Classe</th><th>Option</th><th class="right">Dû</th><th class="right">Encaissé</th><th class="center">État</th></tr></thead>
          <tbody>${tousLesElevesRows}</tbody>
        </table></div>
      ` : ""}

function nouvelleAnneeScolaire(){
  const d = state.data;
  const ancienneAnnee = d.ecole.anneeScolaire || "Année précédente";
  const matchYears = ancienneAnnee.match(/(\d{4}).*?(\d{4})/);
  const suggestion = matchYears ? `${Number(matchYears[1])+1}-${Number(matchYears[2])+1}` : "";

  if(!confirm(
    `Démarrer une nouvelle année scolaire ?\n\n` +
    `Ceci va :\n` +
    `• Archiver les données actuelles (${ancienneAnnee}) — élèves, barème et paiements\n` +
    `• Vider la liste des paiements pour repartir à zéro\n` +
    `• Conserver la liste des élèves (à vous de mettre à jour les classes)\n\n` +
    `Cette action est enregistrée dans le journal. Continuer ?`
  )) return;

  const nouvelleAnnee = prompt("Nom de la nouvelle année scolaire :", suggestion || ancienneAnnee);
  if(!nouvelleAnnee || !nouvelleAnnee.trim()) return;

  if(!d.archives) d.archives = {};
  d.archives[ancienneAnnee] = {
    ecole: JSON.parse(JSON.stringify(d.ecole)),
    bareme: JSON.parse(JSON.stringify(d.bareme)),
    eleves: JSON.parse(JSON.stringify(d.eleves)),
    paiements: JSON.parse(JSON.stringify(d.paiements)),
    archiveLe: new Date().toISOString(),
    archivePar: getCurrentUser(),
  };

  journalAdd("Nouvelle année scolaire", `Archivage de ${ancienneAnnee} → passage à ${nouvelleAnnee.trim()} (${d.eleves.length} élèves, ${d.paiements.length} paiements archivés)`);

  d.paiements = [];
  d.ecole.anneeScolaire = nouvelleAnnee.trim();
  state.dashboardShowAll = false;

  saveData(); render();
  alert(`Nouvelle année scolaire \u00ab ${nouvelleAnnee.trim()} \u00bb démarrée.\n\nL'année ${ancienneAnnee} est archivée et consultable en bas du tableau de bord.`);
}

/* ---------------- Import d'une liste d'élèves ---------------- */
function normalizeHeader(h){
  return (h||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // enlève les accents
    .replace(/[^a-z]/g,"");
}

function parseCsv(text){
  const delimiter = text.indexOf(";") > -1 && text.indexOf(";") < text.indexOf(",") + 1 ? ";" : (text.indexOf(",")>-1?",":";");
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  return lines.map(line => {
    const cells = [];
    let cur = "", inQuotes = false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c === '"'){ inQuotes = !inQuotes; }
      else if(c === delimiter && !inQuotes){ cells.push(cur); cur = ""; }
      else { cur += c; }
    }
    cells.push(cur);
    return cells.map(c => c.trim());
  });
}

function rowsToEleves(rows){
  if(rows.length < 2) return [];
  const header = rows[0].map(normalizeHeader);
  const idx = {
    nom: header.findIndex(h => h === "nom"),
    postnom: header.findIndex(h => h === "postnom"),
    prenom: header.findIndex(h => h === "prenom"),
    sexe: header.findIndex(h => h === "sexe"),
    classe: header.findIndex(h => h === "classe"),
    option: header.findIndex(h => h === "option"),
    statut: header.findIndex(h => h === "statut"),
  };
  if(idx.nom === -1 || idx.classe === -1) return null; // colonnes essentielles manquantes

  return rows.slice(1).filter(r => r[idx.nom]).map(r => ({
    id: uid("el"),
    nom: r[idx.nom] || "",
    postnom: idx.postnom>-1 ? (r[idx.postnom]||"") : "",
    prenom: idx.prenom>-1 ? (r[idx.prenom]||"") : "",
    sexe: idx.sexe>-1 ? (r[idx.sexe]||"M") : "M",
    classe: r[idx.classe] || "",
    option: idx.option>-1 ? (r[idx.option]||"") : "",
    statut: idx.statut>-1 ? (r[idx.statut]||"Normal") : "Normal",
  }));
}

document.getElementById("import-eleves-input").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const text = reader.result;
      let nouveaux = null;

      if(text.indexOf("<?xml") === 0 || text.indexOf("<Workbook") !== -1){
        const doc = new DOMParser().parseFromString(text, "text/xml");
        if(!doc.getElementsByTagName("parsererror").length){
          const rows = sheetToRows(doc, "Élèves");
          nouveaux = rows.length ? rowsToEleves(rows) : null;
        }
      } else if(text.slice(0,2) === "PK"){
        alert("Ce fichier est un .xlsx Excel standard (format compressé) — cette application ne peut pas encore le lire directement.\n\nOuvrez-le dans Excel, faites \"Enregistrer sous\" → Classeur XML 2003 (.xml), puis importez ce fichier. Ou utilisez un fichier .csv.");
        e.target.value = "";
        return;
      } else {
        nouveaux = rowsToEleves(parseCsv(text));
      }

      if(!nouveaux){
        alert("Fichier non reconnu. Colonnes attendues : Nom, Post-nom, Prénom, Sexe, Classe, Option, Statut.");
        e.target.value = "";
        return;
      }
      if(nouveaux.length === 0){
        alert("Aucune ligne d'élève trouvée dans ce fichier.");
        e.target.value = "";
        return;
      }

      state.data.eleves = [...state.data.eleves, ...nouveaux];
      journalAdd("Import liste d'élèves", `${nouveaux.length} élève(s) importé(s) depuis ${file.name}`);
      saveData(); renderView();
      alert(nouveaux.length + " élève(s) importé(s) avec succès.");
    }catch(err){
      console.error(err);
      alert("Une erreur est survenue pendant l'import de ce fichier.");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

const MAX_RECEIPTS_SELECTION = 6;

function playLimitBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.value = 0.001;
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
    setTimeout(() => ctx.close(), 300);
  }catch(e){}
}

function togglePaiementSelect(id){
  if(state.selectedPaiements.has(id)){
    state.selectedPaiements.delete(id);
  } else {
    if(state.selectedPaiements.size >= MAX_RECEIPTS_SELECTION){
      playLimitBeep();
      renderView(); // remet la case décochée visuellement
      return;
    }
    state.selectedPaiements.add(id);
  }
  renderView();
}

function clearPaiementSelection(){
  state.selectedPaiements.clear();
  renderView();
}

        <table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:16px;">
          <thead><tr style="border-bottom:2px solid var(--ink);">
            <th style="text-align:left;padding:6px;">Reçu</th><th style="text-align:left;padding:6px;">Élève</th>
            <th style="text-align:center;padding:6px;">Trim.</th><th style="text-align:left;padding:6px;">Payeur</th>
            <th style="text-align:right;padding:6px;">Montant</th>

        </table>

        <table style="width:100%;font-size:12px;margin-bottom:20px;">
          <tr><td style="padding:2px 0;">Trimestre 1</td><td style="padding:2px 0;text-align:right;">${money(totalParTrimestre[1]||0)}</td></tr>

function onPaiementEleveInput(){
  const val = document.getElementById("np-eleve-name").value;

  if(!val){ hint.textContent = ""; hint.style.color = ""; }

  else { hint.textContent = "Élève non trouvé — vérifiez le nom"; hint.style.color = "var(--late)"; }
}

function onPaiementClasseFiltre(v){ state.paiementClasseFiltre = v; state.paiementsVisibleCount = 10; renderView(); }

function addPaiement(){
  const nameVal = document.getElementById("np-eleve-name").value;
  const el = findEleveByTypedName(nameVal);
  const montant = Number(document.getElementById("np-montant").value) || 0;
  if(!el){ alert("Élève introuvable. Vérifiez l'orthographe ou choisissez un nom proposé dans la liste."); return; }
  if(!montant) return;
  const numero = nextReceiptNumber();
  state.data.paiements.push({
    id: uid("pay"),
    numero,
    eleveId: el.id,
    trimestre: Number(document.getElementById("np-trimestre").value),
    date: document.getElementById("np-date").value,
    montant,
    payeur: document.getElementById("np-payeur").value,
    obs: document.getElementById("np-obs").value,
    annule: false,
  });
  journalAdd("Encaissement", `Reçu ${receiptNumber(numero)} — ${el.nom} ${el.postnom} — ${money(montant)} (T${document.getElementById("np-trimestre").value})`);
  saveData(); renderView();
}

function annulerPaiement(id){
  const p = state.data.paiements.find(x=>x.id===id);
  if(!p) return;
  const el = state.data.eleves.find(e=>e.id===p.eleveId);
  if(!confirm(`Annuler le reçu ${receiptNumber(p.numero)} (${money(p.montant)}) ?\n\nLe reçu reste visible dans l'historique, marqué \u00ab ANNULÉ \u00bb — il ne compte plus dans les totaux encaissés.`)) return;
  const motif = prompt("Motif de l'annulation (facultatif) :", "");
  p.annule = true;
  p.annulePar = getCurrentUser();
  p.annuleLe = new Date().toISOString();
  p.motifAnnulation = motif || "";
  journalAdd("Annulation paiement", `Reçu ${receiptNumber(p.numero)} — ${el?el.nom+' '+el.postnom:'—'} — ${money(p.montant)}${motif?' — motif : '+motif:''}`);
  saveData(); renderView();
}

/* ---------------- Sauvegarde liée à un classeur Excel ---------------- */
/* Génère un vrai classeur multi-feuilles (format SpreadsheetML), lisible et
   modifiable dans Excel, sans dépendre d'aucune bibliothèque externe —
   donc ça marche même hors ligne. */

const SS_NS = "urn:schemas-microsoft-com:office:spreadsheet";

function xmlCell(type, value){
  if(value === undefined || value === null || value === "") return "<Cell><Data ss:Type=\"String\"></Data></Cell>";
  return `<Cell><Data ss:Type="${type}">${esc(value)}</Data></Cell>`;
}
function xmlRow(cells){
  return "<Row>" + cells.map(([t,v]) => xmlCell(t,v)).join("") + "</Row>";
}
function xmlSheet(name, rows){
  return `<Worksheet ss:Name="${esc(name)}"><Table>${rows.join("")}</Table></Worksheet>`;
}

function buildExcelWorkbook(d){
  const infoRows = [
    xmlRow([["String","Nom de l'école"],["String", d.ecole.nom]]),
    xmlRow([["String","Adresse"],["String", d.ecole.adresse]]),
    xmlRow([["String","Téléphone"],["String", d.ecole.telephone]]),
    xmlRow([["String","Email"],["String", d.ecole.email]]),
    xmlRow([["String","Année scolaire"],["String", d.ecole.anneeScolaire]]),
    xmlRow([["String","Version de l'application"],["String", APP_VERSION]]),
  ];

  const baremeRows = [
    xmlRow([["String","ID"],["String","Option"],["String","Tarif T1"],["String","Tarif T2"],["String","Tarif T3"],
             ["String","Tarif Enseignant T1"],["String","Tarif Enseignant T2"],["String","Tarif Enseignant T3"]]),
    ...d.bareme.map(r => xmlRow([
      ["String", r.id], ["String", r.option],
      ["Number", r.t1], ["Number", r.t2], ["Number", r.t3],
      ["Number", r.ens1], ["Number", r.ens2], ["Number", r.ens3],
    ]))
  ];

  const elevesRows = [
    xmlRow([["String","ID"],["String","Nom"],["String","Post-nom"],["String","Prénom"],["String","Sexe"],
             ["String","Classe"],["String","Option"],["String","Statut"],
             ["String","Archivé"],["String","Motif archivage"]]),
    ...d.eleves.map(e => xmlRow([
      ["String", e.id], ["String", e.nom], ["String", e.postnom], ["String", e.prenom],
      ["String", e.sexe], ["String", e.classe], ["String", e.option], ["String", e.statut],
      ["String", e.archive ? "1" : "0"], ["String", e.archiveMotif || ""],
    ]))
  ];

  const paiementsRows = [
    xmlRow([["String","Numéro"],["String","ID"],["String","ID Élève"],["String","Trimestre"],["String","Date"],
             ["String","Montant"],["String","Payeur"],["String","Observation"],
             ["String","Annulé"],["String","Motif annulation"]]),
    ...d.paiements.map(p => xmlRow([
      ["Number", p.numero||0], ["String", p.id], ["String", p.eleveId], ["Number", p.trimestre], ["String", p.date],
      ["Number", p.montant], ["String", p.payeur], ["String", p.obs],
      ["String", p.annule ? "1" : "0"], ["String", p.motifAnnulation || ""],
    ]))
  ];

  const journalRows = [ xmlRow([["String", JSON.stringify(d.journal || [])]]) ];
  const archivesRows = [ xmlRow([["String", JSON.stringify(d.archives || {})]]) ];

  return `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="${SS_NS}" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="${SS_NS}" xmlns:html="http://www.w3.org/TR/REC-html40">
${xmlSheet("Info", infoRows)}
${xmlSheet("Barème", baremeRows)}
${xmlSheet("Élèves", elevesRows)}
${xmlSheet("Paiements", paiementsRows)}
${xmlSheet("Journal", journalRows)}
${xmlSheet("Archives", archivesRows)}
</Workbook>`;
}

function exportExcel(){
  const xml = buildExcelWorkbook(state.data);
  const blob = new Blob([xml], {type:"application/vnd.ms-excel"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "frais-scolaires-" + new Date().toISOString().slice(0,10) + ".xls";
  a.click();
  URL.revokeObjectURL(url);
}

function cellText(cell){
  if(!cell) return "";
  const data = cell.getElementsByTagNameNS(SS_NS, "Data")[0];
  return data ? (data.textContent || "").trim() : "";
}

function sheetToRows(doc, name){
  const sheets = doc.getElementsByTagNameNS(SS_NS, "Worksheet");
  let target = null;
  for(let i=0;i<sheets.length;i++){
    if(sheets[i].getAttributeNS(SS_NS, "Name") === name){ target = sheets[i]; break; }
  }
  if(!target) return [];
  const rows = target.getElementsByTagNameNS(SS_NS, "Row");
  const out = [];
  for(let i=0;i<rows.length;i++){
    const cells = rows[i].getElementsByTagNameNS(SS_NS, "Cell");
    const vals = [];
    for(let j=0;j<cells.length;j++) vals.push(cellText(cells[j]));
    out.push(vals);
  }
  return out;
}

function parseExcelWorkbook(text){
  const doc = new DOMParser().parseFromString(text, "text/xml");
  if(doc.getElementsByTagName("parsererror").length) return null;

  const infoRows = sheetToRows(doc, "Info");
  const ecole = { nom:"", adresse:"", telephone:"", email:"", anneeScolaire:"" };
  const map = { "Nom de l'école":"nom", "Adresse":"adresse", "Téléphone":"telephone", "Email":"email", "Année scolaire":"anneeScolaire" };
  infoRows.forEach(r => { if(map[r[0]]) ecole[map[r[0]]] = r[1] || ""; });

  const baremeRows = sheetToRows(doc, "Barème").slice(1);
  const bareme = baremeRows.filter(r=>r[0]).map(r => ({
    id: r[0] || uid("opt"), option: r[1] || "",
    t1: Number(r[2])||0, t2: Number(r[3])||0, t3: Number(r[4])||0,
    ens1: Number(r[5])||0, ens2: Number(r[6])||0, ens3: Number(r[7])||0,
  }));

  const elevesRows = sheetToRows(doc, "Élèves").slice(1);
  const eleves = elevesRows.filter(r=>r[0]).map(r => ({
    id: r[0] || uid("el"), nom: r[1]||"", postnom: r[2]||"", prenom: r[3]||"",
    sexe: r[4]||"M", classe: r[5]||"", option: r[6]||"", statut: r[7]||"Normal",
    archive: r[8] === "1", archiveMotif: r[9] || "",
  }));

  const paiementsRows = sheetToRows(doc, "Paiements").slice(1);
  const paiements = paiementsRows.filter(r=>r[1]).map(r => ({
    numero: Number(r[0])||0, id: r[1] || uid("pay"), eleveId: r[2]||"", trimestre: Number(r[3])||1, date: r[4]||"",
    montant: Number(r[5])||0, payeur: r[6]||"", obs: r[7]||"",
    annule: r[8] === "1", motifAnnulation: r[9] || "",
  }));

  let journal = [];
  try{
    const journalRows = sheetToRows(doc, "Journal");
    if(journalRows[0] && journalRows[0][0]) journal = JSON.parse(journalRows[0][0]);
  }catch(e){ journal = []; }

  let archives = {};
  try{
    const archivesRows = sheetToRows(doc, "Archives");
    if(archivesRows[0] && archivesRows[0][0]) archives = JSON.parse(archivesRows[0][0]);
  }catch(e){ archives = {}; }

  if(bareme.length===0 && eleves.length===0 && paiements.length===0 && !ecole.nom) return null;
  return { ecole, bareme, eleves, paiements, journal, archives };
}

document.getElementById("import-input").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const text = reader.result;
      let parsed = null;

      if(text.slice(0,2) === "PK"){
        alert("Ce fichier est un .xlsx Excel standard (format compressé) — cette application ne peut pas encore le lire directement.\n\nUtilisez plutôt un classeur exporté par cette application (.xls), ou \"Ouvrir un classeur existant\" pour la liaison directe.");
        e.target.value = "";
        return;
      }

      // classeur Excel (SpreadsheetML) ?
      if(text.indexOf("<?xml") === 0 || text.indexOf("<Workbook") !== -1){
        parsed = parseExcelWorkbook(text);
        if(!parsed){ alert("Ce classeur Excel n'a pas le format attendu (feuilles Info / Barème / Élèves / Paiements)."); e.target.value=""; return; }
      } else {
        // ancienne sauvegarde JSON, encore prise en charge
        try{ parsed = JSON.parse(text); }
        catch(err){ alert("Fichier illisible : ni classeur Excel, ni sauvegarde JSON reconnue."); e.target.value=""; return; }
      }

      state.data = { ...state.data, ...parsed };
      journalAdd("Import classeur", `Copie importée depuis ${file.name}`);
      saveData(); render();
      alert("Données importées avec succès.");
    }catch(err){
      console.error(err);
      alert("Une erreur est survenue pendant l'import de ce fichier.");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ---------------- démarrage ---------------- */
render();
</script>
