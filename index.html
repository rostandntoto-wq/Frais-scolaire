<style>
  :root{
    --ink:#1E2A4A;
    /* Fond légèrement plus foncé qu'auparavant (était presque blanc,
       #FAF7EE) pour que les cartes/tableaux blancs (--card) se distinguent
       clairement du fond de page en thème clair. */
    --paper:#EDE6D3;
    --card:#FFFFFF;
    --gold:#B8863B;
    --paid:#2F6B4F;
    --late:#A6432E;
    --line:#D8CBA6;
    --shade:rgba(30,42,74,0.06);
  }
  html[data-theme="dark"]{
    --ink:#E7EAF3;
    --paper:#121826;
    --card:#1B2337;
    --gold:#D9A75A;
    --paid:#4FC08D;
    --late:#E2695C;
    --line:#2E3A57;
    --shade:rgba(255,255,255,0.06);
  }
  html[data-theme="dark"] body{ background:var(--paper); color:var(--ink); }
  html[data-theme="dark"] .auth-help{ background:#1E2A44; color:var(--ink); }
  html[data-theme="dark"] .auth-footer{ color:#8b93a8; }
  html[data-theme="dark"] .receipt-cell{ border-color:#444; }
  *{box-sizing:border-box;}
  button{color:inherit;font:inherit;}
  .splash-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100vh;width:100%;background:var(--paper);color:var(--ink);}
  .spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:splash-spin .8s linear infinite;}
  .splash-text{font-family:Georgia,serif;font-size:14px;opacity:.75;}
  @keyframes splash-spin{ to{ transform:rotate(360deg); } }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .serif{font-family:Georgia,"Times New Roman",serif;}
  #app{display:flex;min-height:100vh;flex-direction:column;}
  @media(min-width:860px){ #app{flex-direction:row;} }

  /* --- sidebar --- */
  #sidebar{
    background:var(--ink); color:var(--paper);
    display:flex; flex-direction:column;
    flex-shrink:0;
    position:sticky; top:0; z-index:50;
    max-height:100vh; overflow-y:auto;
  }
  @media(min-width:860px){ #sidebar{width:270px; min-height:100vh;} }
  @media(max-width:859px){
    #sidebar{ position:fixed; top:0; left:0; height:100vh; width:280px; max-width:82vw;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 0 rgba(0,0,0,0); }
    #sidebar.mobile-open{ transform:translateX(0); box-shadow:0 0 50px rgba(0,0,0,.35); }
  }
  .sidebar-scrim{ display:none; }
  @media(max-width:859px){
    .sidebar-scrim.show{ display:block; position:fixed; inset:0; background:rgba(15,20,35,.5); z-index:45; }
  }
  .brand{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #33456b;}
  .brand-badge{width:36px;height:36px;border-radius:8px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .brand-label{font-size:10px;text-transform:uppercase;letter-spacing:.2em;opacity:.6;}
  .brand-name{background:transparent;border:none;color:var(--paper);font-family:Georgia,serif;
    font-weight:600;font-size:13.5px;width:100%;outline:none;}

  .profile-card{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid #33456b;}
  .profile-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .profile-name{font-size:13px;font-weight:600;color:white;}
  .profile-role{font-size:10.5px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:5px;margin-top:1px;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;}

  nav.nav-sections{padding:10px 10px 4px;overflow-y:auto;}
  .nav-section-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.38);
    font-weight:700;padding:14px 10px 6px;}
  .nav-section-label:first-child{padding-top:8px;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;width:100%;box-sizing:border-box;
    background:transparent;color:var(--paper);border:none;font-size:13.5px;cursor:pointer;
    white-space:nowrap;text-align:left;flex-shrink:0;}
  .nav-btn.active{background:var(--gold);color:var(--ink);font-weight:600;}

  .sidebar-footer{padding:10px;border-top:1px solid #33456b;margin-top:auto;display:flex;flex-direction:column;gap:2px;}
  .side-link{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:transparent;
    border:none;color:var(--paper);opacity:.8;font-size:12px;cursor:pointer;text-align:left;}
  .side-link:hover{opacity:1;}
  .save-note{padding:8px 12px 4px;font-size:11px;opacity:.5;}
  .logout-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:transparent;
    border:none;color:#f0a898;font-size:12.5px;cursor:pointer;text-align:left;}
  .logout-btn:hover{background:rgba(166,67,46,0.18);}

  /* --- barre du haut --- */
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
    background:var(--card);position:sticky;top:0;z-index:20;}
  @media(min-width:860px){ .topbar{padding:16px 44px;} }
  .hamburger{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);cursor:pointer;flex-shrink:0;}
  @media(min-width:860px){ .hamburger{display:none;} }
  .topbar-date{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);
    font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-help{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;
    border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--ink);cursor:pointer;flex-shrink:0;}

  /* --- main --- */
  main{flex:1;min-width:0;}
  .wrap{max-width:920px;margin:0 auto;padding:20px;}
  @media(min-width:860px){ .wrap{padding:36px 44px;} }
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.25em;color:var(--gold);margin-bottom:4px;}
  h1{font-size:30px;margin:0 0 6px;}
  .subtitle{font-size:13px;opacity:.6;max-width:520px;margin:0 0 28px;}
  .title-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:24px;}

  /* --- cards / stats --- */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:36px;}
  @media(min-width:640px){ .stats-grid{grid-template-columns:repeat(4,1fr);} }
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink);text-decoration:none;}
  .stat-value{font-family:Georgia,serif;font-size:24px;font-weight:600;}
  .stat-label{font-size:12px;opacity:.6;margin-top:4px;}
  .stat-icon-badge{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;color:white;flex-shrink:0;}
  .stat-label-v2{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;font-weight:600;}
  .stat-value-v2{font-family:Georgia,serif;font-size:19px;font-weight:700;color:var(--ink);margin-top:2px;line-height:1.2;}
  .stat-sub{font-size:10.5px;opacity:.5;margin-top:1px;}

  /* --- tables --- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  /* overflow-x:auto (plutôt que hidden) : quand une colonne s'élargit à cause
     d'un texte long (ex. un nom d'option long dans le Barème), le tableau
     devient défilable horizontalement au lieu de rogner silencieusement les
     colonnes de droite. Les coins arrondis restent préservés. */
  .table-wrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto;margin-bottom:20px;}
  thead tr{background:var(--shade);}
  th{text-align:left;padding:11px 14px;font-weight:600;}
  th.right, td.right{text-align:right;}
  th.center, td.center{text-align:center;}
  td{padding:9px 14px;border-top:1px solid var(--line);}
  tbody tr:first-child td{border-top:1px solid var(--line);}

  /* --- forms --- */
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:24px;}
  .form-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin-bottom:10px;}
  .form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}

   Ceci ne remplace PAS encore le stockage local (localStorage). C'est
   uniquement un test pour vérifier que l'app peut se connecter à
   Firebase Authentication et lire Firestore. La bascule complète des
   données se fera dans une étape ultérieure. */
const firebaseConfig = {
  apiKey: "AIzaSyAnRn0TMCT_2acZ99Dnq79ldM3n7FzzFrM",
  authDomain: "gest-frais-scolaires.firebaseapp.com",
  projectId: "gest-frais-scolaires",

  messagingSenderId: "1048797707111",
  appId: "1:1048797707111:web:f16f4b1657660af0740dc2"
};
try{
  firebase.initializeApp(firebaseConfig);
  // Persistance locale (IndexedDB) : après le tout premier chargement,
  // les rechargements suivants lisent d'abord le cache local (quasi
  // instantané) pendant que Firestore se resynchronise en tâche de fond.
  // Permet aussi de continuer à consulter les données sans connexion.
  firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch(function(e){
    console.log("Persistance hors-ligne non activée :", e.code || e);
  });
}catch(e){ console.error("Erreur d'initialisation Firebase", e); }

async function firebaseTestLogin(){
  const email = document.getElementById("fb-test-email").value.trim();
  const password = document.getElementById("fb-test-password").value;
  const resultBox = document.getElementById("fb-test-result");
  resultBox.style.color = "var(--ink)";
  resultBox.textContent = "Connexion en cours...";
  try{
    const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    resultBox.textContent = "Authentifié ✅ (uid: " + uid + "). Lecture du profil...";
    const doc = await firebase.firestore().collection("users").doc(uid).get();
    if(doc.exists){
      const data = doc.data();
      resultBox.style.color = "#1a7d3a";
      resultBox.textContent =
        "✅ Connexion Firebase réussie !\n" +
        "Utilisateur : " + email + "\n" +
        "École (ecoleId) : " + (data.ecoleId || "(non défini)") + "\n" +
        "Rôle : " + (data.role || "(non défini)");
    } else {
      resultBox.style.color = "#b8863b";
      resultBox.textContent = "Authentifié, mais aucun document trouvé dans users/" + uid + ".";
    }
  }catch(e){
    resultBox.style.color = "#c0392b";
    resultBox.textContent = "❌ Échec : " + (e.message || e);
  }
}

/* ---------------- Thème clair / sombre ---------------- */
const THEME_KEY = "suivi-frais-scolaires-theme";
function loadTheme(){
  try{ return localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light"; }
  catch(e){ return "light"; }
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
}
function toggleTheme(){
  state.theme = state.theme === "dark" ? "light" : "dark";
  try{ localStorage.setItem(THEME_KEY, state.theme); }catch(e){}
  applyTheme(state.theme);
  render();
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = { ...SEED_DATA, ...JSON.parse(raw) };
      // Migration : les installations existantes (créées avant l'ajout de
      // l'assistant de configuration) n'ont pas de champ "configured" dans
      // leurs données déjà enregistrées — sans cette migration, l'app les
      // renverrait à chaque lancement vers l'assistant de premier lancement,
      // masquant leurs données réelles derrière cet écran. On détecte donc
      // toute preuve d'un usage réel antérieur (nom d'école déjà renseigné,
      // élèves, paiements, ou compte déjà créé) pour marquer automatiquement
      // l'installation comme configurée.
      if(!data.ecole.configured){
        const dejaUtilisee = !!(data.ecole.nom) || (data.eleves||[]).length>0 ||
          (data.paiements||[]).length>0 || loadAuthUsers().length>0;
        if(dejaUtilisee) data.ecole.configured = true;
      }
      return data;
    }
  }catch(e){
    // stockage local indisponible (ex: fichier ouvert en double-clic) — on démarre quand même
  }
  return JSON.parse(JSON.stringify(SEED_DATA));
}

function saveData(){
  // Le stockage local peut être bloqué par le navigateur (ex: fichier ouvert en
  // double-clic). On protège TOUJOURS cet appel pour que l'affichage se
  // rafraîchisse malgré tout — sinon les boutons "semblent" ne rien faire.
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  }catch(e){
    // on ignore : le classeur lié (si présent) ou l'export manuel prennent le relais
  }
  maybeAutoBackup();
  markPendingSync();
  updateSaveNote();
  scheduleFirestoreSync();
}

/* ---------------- Synchronisation Firestore (élèves, paiements, école, barème) ----------------
   Principe : state.data.eleves / state.data.paiements restent des tableaux en
   mémoire, modifiés exactement comme avant (push/filter/mutation directe) —
   aucune des fonctions d'ajout/modification/suppression n'a besoin de changer.
   On compare simplement, à chaque saveData(), le contenu actuel de ces
   tableaux à la dernière version connue comme synchronisée (lastSyncedEleves /
   lastSyncedPaiements), et on n'envoie vers Firestore QUE ce qui a changé —
   un document par élève / par paiement, sous ecoles/{ecoleId}/eleves|paiements. */
let lastSyncedEleves = new Map();   // id élève -> JSON du dernier état envoyé à Firestore
let lastSyncedPaiements = new Map(); // id paiement -> JSON du dernier état envoyé à Firestore
let firestoreListenersActifs = false;
let firestoreSyncTimer = null;

function scheduleFirestoreSync(){
  if(!state.currentEcoleId) return; // pas encore connecté : rien à synchroniser
  if(firestoreSyncTimer) return;
  firestoreSyncTimer = setTimeout(async () => {
    firestoreSyncTimer = null;
    await runFirestoreSync();
  }, 500); // regroupe les sauvegardes rapprochées (ex: import en masse) en un seul envoi
}

async function runFirestoreSync(){
  const ecoleId = state.currentEcoleId;
  if(!ecoleId) return;
  const db = firebase.firestore();
  const ecoleRef = db.collection("ecoles").doc(ecoleId);
  try{
    await ecoleRef.set({ ecole: state.data.ecole, bareme: state.data.bareme, journal: state.data.journal||[] }, { merge:true });
  }catch(e){ console.error("Synchronisation école/barème/journal impossible :", e); }
  await syncFirestoreCollection(ecoleRef.collection("eleves"), state.data.eleves, lastSyncedEleves);
  await syncFirestoreCollection(ecoleRef.collection("paiements"), state.data.paiements, lastSyncedPaiements);
}

async function syncFirestoreCollection(colRef, currentArray, lastSyncedMap){
  const ops = [];
  const currentIds = new Set();
  for(const item of currentArray){
    if(!item || !item.id) continue;
    currentIds.add(item.id);
    const json = JSON.stringify(item);
    if(lastSyncedMap.get(item.id) !== json) ops.push({type:"set", id:item.id, data:item, json});
  }
  for(const id of Array.from(lastSyncedMap.keys())){
    if(!currentIds.has(id)) ops.push({type:"delete", id});
  }
  if(ops.length === 0) return;
  const db = firebase.firestore();
  try{
    for(let i=0;i<ops.length;i+=400){
      const chunk = ops.slice(i, i+400);
      const batch = db.batch();
      for(const op of chunk){
        if(op.type==="set") batch.set(colRef.doc(op.id), op.data);
        else batch.delete(colRef.doc(op.id));
      }
      await batch.commit();
    }
    for(const op of ops){
      if(op.type==="set") lastSyncedMap.set(op.id, op.json);
      else lastSyncedMap.delete(op.id);
    }
  }catch(e){
    console.error("Synchronisation Firestore impossible :", e);
  }
}

// Premier chargement après connexion : on récupère les données de l'école
// depuis Firestore (source de vérité pour tous les appareils). Si Firestore
// est encore vide pour cette école ET que cet appareil a déjà des données
// réelles en local (cas de l'appareil historique de l'école), on les
// pousse une bonne fois vers le cloud pour amorcer la synchronisation.
// Petit utilitaire : s'abonne à une collection/document et résout une
// promesse dès la PREMIÈRE réponse (locale ou serveur), tout en laissant
// l'écoute active pour les mises à jour suivantes (onUpdate). Avant cette
// version, l'appli faisait un .get() PUIS un onSnapshot séparé pour la même
// donnée — deux lectures facturées pour le même résultat. Un seul
// abonnement suffit : sa première réponse sert de chargement initial.
function ecouterAvecPremierChargement(ref, onUpdate){
  return new Promise((resolve, reject) => {
    let premiereFois = true;
    ref.onSnapshot(snap => {
      if(premiereFois){ premiereFois = false; resolve(snap); }
      else if(onUpdate) onUpdate(snap);
    }, reject);
  });
}

async function loadFromFirestore(ecoleId){
  // Si les écoutes sont déjà actives (ex. Firebase redéclenche l'état de
  // connexion pour rafraîchir le jeton, en cours de session), les données
  // sont déjà chargées et tenues à jour en continu — inutile de tout
  // relire une seconde fois.
  if(firestoreListenersActifs) return "ok";
  firestoreListenersActifs = true;

  const db = firebase.firestore();
  const ecoleRef = db.collection("ecoles").doc(ecoleId);
  const enSaisie = () => {
    const a = document.activeElement;
    return a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA" || a.tagName==="SELECT");
  };

  const [ecoleSnap, elevesSnap, paiementsSnap, archivesSnap] = await Promise.all([
    ecouterAvecPremierChargement(ecoleRef, snap => {
      if(!snap.exists) return;
      const d = snap.data();
      if(d.ecole) state.data.ecole = { ...state.data.ecole, ...d.ecole };
      if(d.bareme) state.data.bareme = d.bareme;
      if(d.journal) state.data.journal = d.journal;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }catch(e){}
      if(!enSaisie()) renderView();
    }),
    ecouterAvecPremierChargement(ecoleRef.collection("eleves"), snap => {
      state.data.eleves = snap.docs.map(d=>d.data());
      lastSyncedEleves = new Map(state.data.eleves.map(e=>[e.id, JSON.stringify(e)]));
      eleveDupIndexArr = null;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }catch(e){}
      if(!enSaisie()) renderView();
    }),
    ecouterAvecPremierChargement(ecoleRef.collection("paiements"), snap => {
      state.data.paiements = snap.docs.map(d=>d.data());
      lastSyncedPaiements = new Map(state.data.paiements.map(p=>[p.id, JSON.stringify(p)]));
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }catch(e){}
      if(!enSaisie()) renderView();
    }),
    ecouterAvecPremierChargement(ecoleRef.collection("archives"), snap => {
      const archives = {};
      snap.docs.forEach(d => { archives[d.id] = d.data(); });
      state.data.archives = archives;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }catch(e){}
      if(!enSaisie()) renderView();
    }),
  ]);

  // Licence : chaque école a une date d'expiration (un an, en général),
  // stockée dans son document ecoles/{ecoleId}, champ licenceExpire
  // (type "horodatage"), réglée manuellement en Firestore Console — jamais
  // modifiable depuis l'application elle-même. Passé cette date, l'accès
  // est bloqué (et les règles de sécurité Firestore l'imposent aussi côté
  // serveur, donc impossible à contourner en modifiant le fichier HTML).
  if(ecoleSnap.exists){
    const d0 = ecoleSnap.data();
    if(d0.licenceExpire && typeof d0.licenceExpire.toDate === "function"){
      const expireLe = d0.licenceExpire.toDate();
      state.licenceExpireLe = expireLe;
      if(expireLe.getTime() < Date.now()){
        return "licence-expiree";
      }
    }
  }

  const cloudEstVide = !ecoleSnap.exists && elevesSnap.empty && paiementsSnap.empty && archivesSnap.empty;
  const ecoleIdLocal = state.data.ecole._ecoleId;
  // Un même appareil pourrait, un jour, être utilisé pour deux écoles
  // différentes (ex : test). On ne considère les données locales comme
  // "à migrer" que si elles n'ont encore jamais été associées à une AUTRE
  // école — sinon on risquerait de pousser les données de l'école A dans
  // l'espace Firestore de l'école B.
  const localDejaConfigure = !!state.data.ecole.configured && (!ecoleIdLocal || ecoleIdLocal === ecoleId);

  if(cloudEstVide && localDejaConfigure){
    lastSyncedEleves = new Map();
    lastSyncedPaiements = new Map();
    await runFirestoreSync();
    // Migration initiale des archives existantes (une seule fois, tant que
    // le cloud est vide) — peu fréquent, donc pas besoin du même mécanisme
    // de diff incrémental que pour élèves/paiements.
    const archives = state.data.archives || {};
    for(const annee of Object.keys(archives)){
      try{ await ecoleRef.collection("archives").doc(annee).set(archives[annee]); }
      catch(e){ console.error("Migration de l'archive impossible :", annee, e); }
    }
    state.data.ecole._ecoleId = ecoleId;
  } else if(cloudEstVide && !localDejaConfigure){
    // École réellement nouvelle (ni cloud ni cet appareil n'ont de données
    // qui lui appartiennent) : on ne touche à rien ici, initApp() proposera
    // l'assistant de configuration plutôt que d'afficher un tableau de bord
    // vide, ou pire, les données d'une autre école restées en local.
    return "nouvelle-ecole";
  } else {
    if(ecoleSnap.exists){
      const d = ecoleSnap.data();
      if(d.ecole) state.data.ecole = { ...state.data.ecole, ...d.ecole };
      if(d.bareme) state.data.bareme = d.bareme;
      if(d.journal) state.data.journal = d.journal;
    }
    state.data.eleves = elevesSnap.docs.map(d=>d.data());
    state.data.paiements = paiementsSnap.docs.map(d=>d.data());
    state.data.archives = {};
    archivesSnap.docs.forEach(d => { state.data.archives[d.id] = d.data(); });
    eleveDupIndexArr = null;
    lastSyncedEleves = new Map(state.data.eleves.map(e=>[e.id, JSON.stringify(e)]));
    lastSyncedPaiements = new Map(state.data.paiements.map(p=>[p.id, JSON.stringify(p)]));
    state.data.ecole.configured = true;
    state.data.ecole._ecoleId = ecoleId;
  }

  return "ok";
}

/* ---------------- Synchronisation Excel périodique ---------------- */
// Plutôt que de réécrire tout le classeur Excel à chaque paiement (coûteux
// avec beaucoup de données), on marque juste qu'une synchronisation est due
// et un minuteur périodique s'en charge — plus un bouton pour forcer une
// synchronisation immédiate.
const SYNC_INTERVAL_MS = 60 * 1000; // synchronisation auto toutes les 60 secondes si des changements sont en attente
let pendingSync = false;

function markPendingSync(){
  if(linkedFileHandle) pendingSync = true;
}

setInterval(() => {
  if(pendingSync && linkedFileHandle && linkedFileStatus !== "saving"){
    pendingSync = false;
    syncToLinkedFile();
  }
}, SYNC_INTERVAL_MS);

// Tentative de synchronisation de dernière chance quand l'onglet passe en
// arrière-plan ou se ferme — best-effort, sans bloquer l'utilisateur.
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden" && pendingSync && linkedFileHandle && linkedFileStatus !== "saving"){
    pendingSync = false;
    syncToLinkedFile();
  }
});

async function syncNow(){
  if(!linkedFileHandle){ await showAlert("Aucun classeur n'est actuellement lié."); return; }
  pendingSync = false;
  await syncToLinkedFile();
  renderView();
}

/* ---------------- Sauvegardes automatiques (filet de sécurité local) ---------------- */
const AUTOBACKUP_KEY = "suivi-frais-scolaires-autobackups";
// Copies complètes des données conservées dans le navigateur : on limite le
// nombre de versions et on espace davantage les sauvegardes pour éviter
// d'accumuler trop de copies volumineuses dans le stockage local (limité à
// quelques Mo par navigateur).
const AUTOBACKUP_MAX = 5;
const AUTOBACKUP_MIN_INTERVAL_MS = 15 * 60 * 1000; // au plus une sauvegarde auto toutes les 15 min
let lastAutoBackupAt = 0;

function loadAutoBackups(){
  try{ return JSON.parse(localStorage.getItem(AUTOBACKUP_KEY)) || []; }
  catch(e){ return []; }
}

function maybeAutoBackup(){
  const now = Date.now();
  if(now - lastAutoBackupAt < AUTOBACKUP_MIN_INTERVAL_MS) return;
  lastAutoBackupAt = now;
  try{
    const backups = loadAutoBackups();
    backups.push({
      ts: new Date().toISOString(),
      nbEleves: state.data.eleves.length,
      nbPaiements: state.data.paiements.length,
      data: JSON.parse(JSON.stringify(state.data)),
    });
    while(backups.length > AUTOBACKUP_MAX) backups.shift();
    localStorage.setItem(AUTOBACKUP_KEY, JSON.stringify(backups));
  }catch(e){
    // stockage plein ou indisponible — on n'interrompt pas l'utilisateur pour ça
  }
}

function viewSauvegardes(){
  const backups = loadAutoBackups().slice().reverse();
  const rows = backups.map((b, i) => {
    const idx = backups.length - 1 - i; // index réel dans le tableau non inversé
    return `<tr>
      <td>${formatDateTimeFr(b.ts)}</td>
      <td class="right">${b.nbEleves}</td>
      <td class="right">${b.nbPaiements}</td>
      <td class="right"><button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="restaurerAutoBackup(${idx})">↩️ Restaurer</button></td>
    </tr>`;
  }).join("");

  return `
    <div class="title-row"><div>
      <div class="eyebrow">Sécurité des données</div>
      <h1 class="serif">Sauvegardes automatiques</h1>
      <p class="subtitle">L'application enregistre automatiquement un instantané de vos données dans ce navigateur, au plus toutes les 15 minutes d'activité — jusqu'à ${AUTOBACKUP_MAX} versions conservées.</p>
    </div></div>

    <div class="warn">⚠️ Ces sauvegardes automatiques restent dans CE navigateur uniquement. Elles ne remplacent pas l'export régulier ni la liaison à un classeur Excel — utilisez-les en dernier recours.</div>

    ${backups.length===0 ? emptyState("🛟","Aucune sauvegarde automatique pour l'instant","Une sauvegarde sera créée automatiquement au fil de votre utilisation de l'application.") : `
      <div class="table-wrap"><table>
        <thead><tr><th>Date &amp; heure</th><th class="right">Élèves</th><th class="right">Paiements</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    `}
  `;
}

async function restaurerAutoBackup(index){
  const backups = loadAutoBackups();
  const b = backups[index];
  if(!b) return;
  if(!(await showConfirm(
    `Restaurer l'état du ${formatDateTimeFr(b.ts)} (${b.nbEleves} élèves, ${b.nbPaiements} paiements) ?\n\nCela remplacera les données actuellement affichées. Vos modifications non sauvegardées depuis seront perdues.`,
    {title:"Restaurer une sauvegarde automatique"}
  ))) return;
  state.data = JSON.parse(JSON.stringify(b.data));
  journalAdd("Restauration d'une sauvegarde automatique", formatDateTimeFr(b.ts));
  saveData(); render();
  await showAlert("Données restaurées depuis la sauvegarde du " + formatDateTimeFr(b.ts) + ".");
}

function updateSaveNote(){
  const note = document.getElementById("save-note");
  if(!note) return;
  if(linkedFileHandle){
    note.textContent = linkedFileStatus === "saving" ? ("Écriture dans " + linkedFileName + "…")
      : linkedFileStatus === "error" ? ("⚠️ Échec d'écriture dans " + linkedFileName)
      : linkedFileStatus === "conflict" ? ("⚠️ Conflit détecté sur " + linkedFileName)
      : pendingSync ? ("Classeur lié : " + linkedFileName + " — sync. en attente…")
      : ("Classeur lié : " + linkedFileName + " ✓");
  } else {
    note.textContent = "✓ Synchronisé";
  }
}

/* ---------------- Liaison directe à un classeur Excel (File System Access API) ---------------- */
const FS_ACCESS_OK = "showSaveFilePicker" in window && "showOpenFilePicker" in window;

async function syncToLinkedFile(){
  if(!linkedFileHandle) return;
  linkedFileStatus = "saving";
  updateSaveNote();
  try{
    // Détection de conflit : si le fichier sur le disque a changé depuis notre
    // dernière lecture/écriture (ex : quelqu'un d'autre l'a modifié), on ne
    // l'écrase pas — on prévient plutôt que de perdre son travail.
    if(lastSyncedSnapshot !== null){
      const currentFile = await linkedFileHandle.getFile();
      const currentBytes = new Uint8Array(await currentFile.arrayBuffer());
      if(!bytesEqual(currentBytes, lastSyncedSnapshot)){
        linkedFileStatus = "conflict";
        updateSaveNote();
        render();
        return;
      }
    }
    const bytes = await buildXlsxWorkbook(state.data);
    const writable = await linkedFileHandle.createWritable();
    await writable.write(bytes);
    await writable.close();
    lastSyncedSnapshot = bytes;
    lastSyncTime = new Date().toISOString();
    linkedFileStatus = "saved";
  }catch(e){
    linkedFileStatus = "error";
    console.error("Échec d'écriture dans le classeur lié :", e);
  }
  updateSaveNote();
}

function bytesEqual(a, b){
  if(!a || !b || a.length !== b.length) return false;
  for(let i=0;i<a.length;i++) if(a[i] !== b[i]) return false;
  return true;
}

// Lit un classeur quel que soit son format : .xlsx moderne (ZIP) en priorité —
// avec repli automatique sur l'ancien format .xls (SpreadsheetML) pour les
// classeurs liés avant la mise à jour vers .xlsx.
async function parseAnyWorkbook(bytes){
  if(bytes.length >= 2 && bytes[0] === 0x50 && bytes[1] === 0x4B){ // signature ZIP "PK"
    const result = await parseXlsxWorkbook(bytes);
    if(result && result.error === "compressed"){
      return { error: "Ce fichier .xlsx a été enregistré avec compression (probablement réenregistré depuis Excel). Cette application ne peut relire que les classeurs qu'elle a elle-même générés, sans les réenregistrer depuis Excel. Réexportez une copie depuis l'application." };
    }
    if(!result) return { error: "Ce classeur .xlsx n'a pas la structure attendue." };
    return { data: result };
  }
  const text = new TextDecoder("utf-8").decode(bytes);
  if(text.indexOf("<?xml") === 0 || text.indexOf("<Workbook") !== -1){
    const parsed = parseExcelWorkbook(text);
    if(!parsed) return { error: "Ce classeur (ancien format .xls) n'a pas la structure attendue." };
    return { data: parsed };
  }
  try{
    return { data: JSON.parse(text) };
  }catch(e){
    return { error: "Format de fichier non reconnu." };
  }
}

async function rechargerClasseurLie(){
  if(!linkedFileHandle) return;
  try{
    const file = await linkedFileHandle.getFile();
    const bytes = new Uint8Array(await file.arrayBuffer());
    const result = await parseAnyWorkbook(bytes);
    if(result.error){ await showAlert(result.error); return; }
    state.data = { ...state.data, ...result.data };
    lastSyncedSnapshot = bytes;
    lastSyncTime = new Date().toISOString();
    linkedFileStatus = "saved";
    render();
    await showAlert("Dernière version du classeur rechargée. Vos modifications non enregistrées ont été remplacées par le contenu du fichier.");
  }catch(e){
    await showAlert("Impossible de relire le classeur lié.");
  }
}

/* ---------------- Mémorisation du classeur lié (reconnexion automatique) ---------------- */
// On garde une référence au fichier lié dans IndexedDB (le seul stockage du
// navigateur capable de conserver un FileSystemFileHandle). Au prochain
// lancement, on peut ainsi se reconnecter sans repasser par le sélecteur de
// fichier — automatiquement si l'autorisation est encore active, ou en un
// seul clic sinon (les navigateurs exigent un geste de l'utilisateur pour
// redonner l'autorisation d'écriture).
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("suivi-frais-scolaires-db", 1);
    req.onupgradeneeded = () => { req.result.createObjectStore("handles"); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSetHandle(handle){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").put(handle, "linkedFile");
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ /* pas grave — la reconnexion auto ne sera simplement pas proposée */ }
}
async function idbGetHandle(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve) => {
      const tx = db.transaction("handles", "readonly");
      const req = tx.objectStore("handles").get("linkedFile");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  }catch(e){ return null; }
}
async function idbClearHandle(){
  try{
    const db = await idbOpen();
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").delete("linkedFile");
  }catch(e){}
}

async function tryAutoReconnect(){
  if(!FS_ACCESS_OK) return;
  const handle = await idbGetHandle();
  if(!handle) return;
  try{
    const perm = await handle.queryPermission({ mode: "readwrite" });
    if(perm === "granted"){
      const file = await handle.getFile();
      const bytes = new Uint8Array(await file.arrayBuffer());
      const result = await parseAnyWorkbook(bytes);
      if(!result.error){
        linkedFileHandle = handle;
        linkedFileName = handle.name;
        state.data = { ...state.data, ...result.data };
        lastSyncedSnapshot = bytes;
    lastSyncTime = new Date().toISOString();
        linkedFileStatus = "saved";
        render();
      }
    } else if(perm === "prompt"){
      // autorisation à reconfirmer — on propose un simple bouton, pas tout le flux de sélection
      state.pendingReconnectHandle = handle;
      state.pendingReconnectName = handle.name;
      render();
    }
  }catch(e){
    // fichier introuvable, déplacé ou supprimé — on oublie cette liaison
    idbClearHandle();
  }
}

async function confirmReconnect(){
  const handle = state.pendingReconnectHandle;
  if(!handle) return;
  try{
    const perm = await handle.requestPermission({ mode: "readwrite" });
    if(perm !== "granted"){
      state.pendingReconnectHandle = null;
      render();
      return;
    }
    const file = await handle.getFile();
    const bytes = new Uint8Array(await file.arrayBuffer());
    const result = await parseAnyWorkbook(bytes);
    if(result.error){
      await showAlert(result.error);
      state.pendingReconnectHandle = null;
      render();
      return;
    }
    linkedFileHandle = handle;
    linkedFileName = handle.name;
    state.data = { ...state.data, ...result.data };
    lastSyncedSnapshot = bytes;
    lastSyncTime = new Date().toISOString();
    state.pendingReconnectHandle = null;
    saveData();
    render();
  }catch(e){
    state.pendingReconnectHandle = null;
    render();
  }
}

function ignorerReconnexion(){
  state.pendingReconnectHandle = null;
  idbClearHandle();
  render();
}

async function creerClasseurLie(){
  if(!FS_ACCESS_OK){
    await showAlert("Votre navigateur ne permet pas de lier un fichier directement (fonctionne sur Chrome ou Edge). Utilisez Exporter/Importer à la place.");
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: "REGISTRE_FRAIS_" + (state.data.ecole.anneeScolaire||"").replace(/[^\w-]/g,"") + ".xlsx",
      types: [{ description: "Classeur Excel", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }]
    });

/* ---------------- Mécanisme de mise à jour ---------------- */
function compareVersions(a, b){
  const pa = String(a).split(".").map(n => parseInt(n,10) || 0);
  const pb = String(b).split(".").map(n => parseInt(n,10) || 0);
  for(let i=0; i<Math.max(pa.length, pb.length); i++){
    const diff = (pa[i]||0) - (pb[i]||0);
    if(diff !== 0) return diff > 0 ? 1 : -1;
  }
  return 0;
}

async function checkForUpdates(){
  if(!UPDATE_CHECK_URL){
    await showAlert(
      "La vérification des mises à jour n'est pas configurée sur cette installation.\n\n" +
      "Version actuelle : " + APP_VERSION + "\n\n" +
      "Pour l'activer, il faut héberger un petit fichier JSON décrivant la dernière version " +
      "et renseigner son adresse dans le code de l'application (constante UPDATE_CHECK_URL)."
    );
    return;
  }
  try{
    const res = await fetch(UPDATE_CHECK_URL, { cache: "no-store" });
    const info = await res.json();
    if(info && info.version && compareVersions(info.version, APP_VERSION) > 0){
      state.updateAvailable = info;
      render();
    } else {
      state.updateAvailable = null;
      await showAlert("Vous utilisez déjà la dernière version (" + APP_VERSION + ").");
      render();
    }
  }catch(e){
    await showAlert("Impossible de vérifier les mises à jour (pas de connexion internet, ou adresse invalide).");
  }
}

function showModal({title, message, confirmLabel="Confirmer", cancelLabel="Annuler", danger=false, input=null, alertOnly=false}){
  return new Promise(resolve => {
    const old = document.getElementById("custom-modal-overlay");
    if(old) old.remove();

    const overlay = document.createElement("div");
    overlay.id = "custom-modal-overlay";
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(30,42,74,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;";

    const box = document.createElement("div");
    box.style.cssText = "background:var(--card);color:var(--ink);border-radius:12px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,0.35);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;";

    const titleEl = document.createElement("div");
    titleEl.style.cssText = `font-family:Georgia,serif;font-size:18px;font-weight:bold;color:${danger?"var(--late)":"var(--ink)"};margin-bottom:10px;`;
    titleEl.textContent = title || (danger ? "⚠️ Attention" : "Registre des frais scolaires");
    box.appendChild(titleEl);

    if(message){
      const msgEl = document.createElement("div");
      msgEl.style.cssText = "font-size:13px;color:var(--ink);opacity:.85;line-height:1.6;white-space:pre-line;margin-bottom:16px;";
      msgEl.textContent = message;
      box.appendChild(msgEl);
    }

    let inputEl = null;
    if(input){
      const label = document.createElement("div");
      label.style.cssText = "font-size:12px;color:var(--ink);opacity:.7;margin-bottom:6px;";
      label.textContent = input.label || "Veuillez préciser le motif de cette opération (amende si nécessaire)";
      box.appendChild(label);
      inputEl = document.createElement("input");
      inputEl.value = input.defaultValue || "";
      inputEl.placeholder = input.placeholder || "";
      inputEl.style.cssText = "width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:16px;box-sizing:border-box;outline:none;background:var(--paper);color:var(--ink);";
      box.appendChild(inputEl);
    }

    const btnRow = document.createElement("div");
    btnRow.style.cssText = "display:flex;justify-content:flex-end;gap:8px;margin-top:4px;";

    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = cancelLabel;
    cancelBtn.style.cssText = "padding:9px 16px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;";

    const confirmBtn = document.createElement("button");
    confirmBtn.textContent = confirmLabel;
    confirmBtn.style.cssText = `padding:9px 16px;border-radius:7px;border:none;background:${danger?"#A6432E":"#1E2A4A"};color:white;font-size:13px;font-weight:600;cursor:pointer;`;

    if(!alertOnly) btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    if(inputEl){ inputEl.focus(); inputEl.select(); }
    else confirmBtn.focus();

    function cleanup(result){ overlay.remove(); resolve(result); }
    cancelBtn.onclick = () => cleanup(input ? null : false);
    confirmBtn.onclick = () => cleanup(input ? inputEl.value : true);
    overlay.onclick = (e) => { if(e.target === overlay) cleanup(alertOnly ? true : (input ? null : false)); };
    document.addEventListener("keydown", function esc(e){
      if(e.key === "Escape"){ document.removeEventListener("keydown", esc); cleanup(alertOnly ? true : (input ? null : false)); }
    });
  });
}

/* ---------------- Son d'alerte ----------------
   Un petit bip (Web Audio API, aucun fichier son à charger) joué à chaque
   message d'alerte pour attirer l'attention de l'utilisateur. */
let alertAudioCtx = null;
function playAlertSound(){
  try{
    if(!alertAudioCtx) alertAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(alertAudioCtx.state === "suspended") alertAudioCtx.resume();
    const ctx = alertAudioCtx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.24);
  }catch(e){
    // navigateur sans support audio, ou lecture bloquée : on ignore silencieusement
  }
}

/* ---------------- Montant en toutes lettres (pour les reçus) ---------------- */
function nombreEnLettresFr(n){
  n = Math.round(Math.abs(Number(n)||0));
  if(n === 0) return "ZÉRO";
  const unites = ["","UN","DEUX","TROIS","QUATRE","CINQ","SIX","SEPT","HUIT","NEUF","DIX","ONZE","DOUZE","TREIZE","QUATORZE","QUINZE","SEIZE","DIX-SEPT","DIX-HUIT","DIX-NEUF"];
  const dizaines = ["","","VINGT","TRENTE","QUARANTE","CINQUANTE","SOIXANTE","SOIXANTE","QUATRE-VINGT","QUATRE-VINGT"];

  function dizainesTxt(v){ // 0-99
    if(v < 20) return unites[v];
    const d = Math.floor(v/10), u = v % 10;
    if(d === 7 || d === 9) return dizaines[d] + "-" + unites[10+u];
    if(u === 0) return dizaines[d] + (d === 8 ? "S" : "");
    if(u === 1 && d !== 8) return dizaines[d] + " ET UN";
    return dizaines[d] + "-" + unites[u];
  }
  function centainesTxt(v){ // 0-999
    const c = Math.floor(v/100), r = v % 100;
    let s = "";
    if(c > 0){
      s += (c > 1 ? unites[c] + " " : "") + "CENT" + (c > 1 && r === 0 ? "S" : "");
      if(r > 0) s += " ";
    }
    if(r > 0) s += dizainesTxt(r);
    return s;
  }

  const groupes = [
    { valeur:1000000000, singulier:"MILLIARD", pluriel:"MILLIARDS" },
    { valeur:1000000, singulier:"MILLION", pluriel:"MILLIONS" },
    { valeur:1000, singulier:"MILLE", pluriel:"MILLE" },
  ];
  let reste = n, parts = [];
  for(const g of groupes){
    const q = Math.floor(reste / g.valeur);
    if(q > 0){
      parts.push(g.valeur === 1000 && q === 1 ? "MILLE" : centainesTxt(q) + " " + (q > 1 ? g.pluriel : g.singulier));
      reste = reste % g.valeur;
    }
  }
  if(reste > 0 || parts.length === 0) parts.push(centainesTxt(reste));
  return parts.join(" ").replace(/\s+/g," ").trim();
}

function montantEnLettres(n){
  return nombreEnLettresFr(n) + " FRANCS CONGOLAIS";
}

function receiptNumber(n){

// Code reçu par défaut quand l'enseignant n'en a pas de renseigné dans son
// profil : dérivé de son e-mail plutôt que de bloquer la saisie. Reconnaît
// le motif "prenom.nom@..." ou "prenom_nom@..." (initiales des deux
// parties) ; sinon, les deux premières lettres de la partie avant @.
function deriveRecuCode(email){
  const local = String(email||"").split("@")[0] || "XX";
  const parts = local.split(/[._-]+/).filter(Boolean);
  if(parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return (local.slice(0,2) || "XX").toUpperCase();
}

// Numéro de reçu complet tel qu'affiché/imprimé : préfixe de l'enseignant
// qui a encaissé + numéro séquentiel propre à cet enseignant (voir
// nextReceiptNumber). Les paiements enregistrés avant l'introduction de ce
// système n'ont pas de recuCode : ils s'affichent sans préfixe.
function receiptCode(p){
  return (p && p.recuCode ? p.recuCode + "-" : "") + receiptNumber((p && p.numero) || 0);
}

function dateFr(iso){
  if(!iso) return "—";
  const parts = iso.split("-");
  if(parts.length !== 3) return iso;
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

function esc(s){
  if(s === undefined || s === null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function tarifPourEleve(bareme, eleve, trimestre){
  const row = bareme.find(b => b.option === eleve.option);
  if(!row) return 0;
  const enseignant = eleve.statut === "Enfant enseignant";
  const key = enseignant ? ("ens"+trimestre) : ("t"+trimestre);
  return Number(row[key]) || 0;
}

function duTotal(bareme, eleve){
  return [1,2,3].reduce((s,t) => s + tarifPourEleve(bareme, eleve, t), 0);

function classesUniques(eleves){

function classeOptionLabel(el){

function classeOptionGroups(eleves){
  const map = new Map();
  eleves.forEach(e => {
    const classe = e.classe || "Sans classe";
    const option = e.option || "";
    const value = classe + "||" + option;
    const label = option ? `${classe} ${option}` : classe;
    if(!map.has(value)) map.set(value, label);
  });
  const groups = [...map.entries()].map(([value,label]) => ({value,label}));
  groups.sort((a,b) => a.label.localeCompare(b.label));
  return [{value:"Toutes", label:"Toutes"}, ...groups];
}

// Index paiements par élève — évite de rebalayer tout le tableau des paiements
// pour chaque élève (coûteux quand il y a beaucoup d'élèves ET de paiements).
function paiementsParEleve(paiements){
  const map = new Map();
  for(const p of paiements){
    let arr = map.get(p.eleveId);
    if(!arr){ arr = []; map.set(p.eleveId, arr); }
    arr.push(p);
  }
  return map;
}
function payeTotal(payMap, eleveId, trimestre){
  const arr = payMap.get(eleveId);
  if(!arr) return 0;
  let total = 0;
  for(const p of arr){
    if(p.annule) continue;
    if(trimestre && Number(p.trimestre) !== trimestre) continue;
    total += Number(p.montant||0);
  }
  return total;
}

function nextReceiptNumber(){
  // Numérotation propre à CHAQUE enseignant (voir state.currentRecuCode) :
  // impossible pour deux personnes de produire le même numéro de reçu,
  // même hors-ligne en même temps, puisque chacune a sa propre suite.
  // Mise en cache par code tant que le tableau de paiements ne change pas.
  const code = state.currentRecuCode || "";
  if(receiptMaxArr !== state.data.paiements || receiptMaxCode !== code){
    receiptMaxNum = state.data.paiements.reduce((max,p) => (p.recuCode||"")===code ? Math.max(max, Number(p.numero)||0) : max, 0);
    receiptMaxArr = state.data.paiements;
    receiptMaxCode = code;
  }
  return receiptMaxNum + 1;
}
let receiptMaxArr = null, receiptMaxNum = 0, receiptMaxCode = null;
function noteReceiptNumberUsed(numero){
  receiptMaxArr = state.data.paiements;
  receiptMaxCode = state.currentRecuCode || "";
  receiptMaxNum = Math.max(receiptMaxNum, Number(numero)||0);
}

/* ---------------- Index de détection des doublons (élèves & paiements) ----------------
   Recalculer un .find() sur tout le tableau à chaque ajout devient lent avec
   des dizaines de milliers d'entrées. On maintient plutôt une Map, réutilisée
   tant que le tableau source n'a pas été remplacé (référence inchangée — donc
   valable pour de simples .push()), et reconstruite une seule fois sinon. */
let eleveDupIndexArr = null, eleveDupIndexMap = null;
function eleveDupKey(nom, postnom, classe){
  return (nom||"").trim().toLowerCase() + "|" + (postnom||"").trim().toLowerCase() + "|" + (classe||"").trim().toLowerCase();
}
function getEleveDupIndex(){
  if(eleveDupIndexArr !== state.data.eleves){
    eleveDupIndexMap = new Map();
    for(const e of state.data.eleves){
      if(!e.archive) eleveDupIndexMap.set(eleveDupKey(e.nom, e.postnom, e.classe), e);
    }
    eleveDupIndexArr = state.data.eleves;
  }
  return eleveDupIndexMap;
}

let paiementDupIndexArr = null, paiementDupIndexMap = null;
function paiementDupKey(eleveId, trimestre, montant, date){
  return eleveId + "|" + trimestre + "|" + Number(montant) + "|" + date;
}
function getPaiementDupIndex(){
  if(paiementDupIndexArr !== state.data.paiements){
    paiementDupIndexMap = new Map();
    for(const p of state.data.paiements){
      if(!p.annule) paiementDupIndexMap.set(paiementDupKey(p.eleveId, p.trimestre, p.montant, p.date), p);
    }
    paiementDupIndexArr = state.data.paiements;
  }
  return paiementDupIndexMap;
}

function findEleveByTypedName(text){
  const t = (text||"").trim().toLowerCase();
  if(!t) return null;
  const eleves = state.data.eleves;
  let match = eleves.find(e => eleveLabelWithClasse(e).toLowerCase() === t);
  if(match) return match;
  match = eleves.find(e => eleveLabelFull(e).toLowerCase() === t);
  if(match) return match;
  const candidates = eleves.filter(e => eleveLabelWithClasse(e).toLowerCase().startsWith(t) || eleveLabelFull(e).toLowerCase().startsWith(t));
  return candidates.length === 1 ? candidates[0] : null;
}

function renderView(){
  const root = document.getElementById("view-root");
  if(state.view === "parametres") { root.innerHTML = viewParametres(); return; }
  // Les vues « Données » et « Administration » restent accessibles via des
  // liens directs (setView) mais vivent derrière le bouton Paramètres — on
  // leur ajoute un fil d'Ariane pour y revenir.
  const isParamView = PARAM_VIEWS.includes(state.view);
  if(state.view === "connectivite") root.innerHTML = viewConnectivite();
  if(state.view === "firebase-test") root.innerHTML = viewFirebaseTest();
  if(state.view === "debiteurs") root.innerHTML = viewDebiteurs();
  if(state.view === "statistiques") root.innerHTML = viewStatistiques();
  if(state.view === "miseajour") root.innerHTML = viewMiseAJour();
  if(state.view === "journal") root.innerHTML = viewJournal();
  if(state.view === "recettes") root.innerHTML = viewRecettes();
  if(state.view === "utilisateurs") root.innerHTML = viewUtilisateurs();
  if(state.view === "sauvegardes") root.innerHTML = viewSauvegardes();
  if(state.view === "anneescolaire") root.innerHTML = viewAnneeScolaire();
  if(state.view === "dashboard") root.innerHTML = viewDashboard();

  if(state.view === "eleves") root.innerHTML = viewEleves();

}

function setView(v){
  state.view = v;
  render();
}

/* ---------------- Tableau de bord (par trimestre) ---------------- */
function viewDashboard(){
  const d = state.data;
  const t = state.dashboardTrimestre;
  const elevesActifs = d.eleves.filter(e => !e.archive);
  const nbEleves = elevesActifs.length;
  const empty = nbEleves === 0;

  let attendu=0, encaisse=0, nbRetard=0;
  const parGroupe = {};
  const payMap = paiementsParEleve(d.paiements);

  elevesActifs.forEach(el => {
    const due = tarifPourEleve(d.bareme, el, t);
    const paye = payeTotal(payMap, el.id, t);
    attendu += due; encaisse += paye;
    if(paye < due) nbRetard++;
    const classe = el.classe || "Sans classe";
    const option = el.option || "Sans option";
    const key = classe + "|" + option;
    if(!parGroupe[key]) parGroupe[key] = {classe, option, due:0, paye:0, n:0};
    parGroupe[key].due += due; parGroupe[key].paye += paye; parGroupe[key].n++;
  });

  const retard = Math.max(0, attendu - encaisse);

  const dashboardClasseGroups = classeOptionGroups(elevesActifs);
  // Le calcul détaillé de "tous les élèves" est coûteux avec beaucoup de paiements —
  // on ne le fait que si la liste est effectivement affichée.
  const tousLesEleves = !state.dashboardShowAll ? [] : [...elevesActifs].filter(el => {
    if(state.dashboardEleveFiltre === "Toutes") return true;
    const groupValue = (el.classe||"Sans classe") + "||" + (el.option||"");
    return groupValue === state.dashboardEleveFiltre;
  }).sort((a,b) => {
    const c = (a.classe||"").localeCompare(b.classe||"");
    return c !== 0 ? c : (a.nom||"").localeCompare(b.nom||"");
  }).map(el => {
    const due = tarifPourEleve(d.bareme, el, t);
    const paye = payeTotal(payMap, el.id, t);
    return { el, due, paye, solde: due - paye };
  });

  const tousLesElevesDisplayed = state.dashboardElevesShowAll ? tousLesEleves : tousLesEleves.slice(0, 20);
  const tousLesElevesRows = tousLesElevesDisplayed.map(({el, due, paye, solde}) => `
    <tr>
      <td>${esc(el.nom)} ${esc(el.postnom)} ${esc(el.prenom)}</td>
      <td>${esc(classeOptionLabel(el))}</td>
      <td class="right">${money(due)}</td>
      <td class="right pos">${money(paye)}</td>
      <td class="center">${solde<=0 ? '<span class="pos">✓ à jour</span>' : `<span class="neg">${money(solde)}</span>`}</td>
    </tr>`).join("");

  const tabsHtml = [1,2,3].map(tt => `
    <button class="nav-btn" style="color:var(--ink);width:auto;flex:0 0 auto;padding:7px 16px;${tt===t?`background:var(--gold);font-weight:600;`:`background:var(--card);border:1px solid var(--line);`}"
      onclick="setDashboardTrimestre(${tt})">Trimestre ${tt}</button>
  `).join("");

  const classeRows = Object.values(parGroupe).sort((a,b) => {
    const c = a.classe.localeCompare(b.classe);
    return c !== 0 ? c : a.option.localeCompare(b.option);
  }).map(c => {
    const taux = c.due>0 ? Math.round(c.paye/c.due*100) : 0;
    const label = c.option === "Sans option" ? c.classe : `${c.classe} ${c.option}`;
    return `<tr>
      <td>${esc(label)}</td><td class="right">${c.n}</td><td class="right">${money(c.due)}</td>
      <td class="right pos">${money(c.paye)}</td><td class="right">${taux}%</td>
      <td class="right"><button class="icon-btn" title="Imprimer" onclick="printClassList('${esc(c.classe)}', '${esc(c.option)}', ${t})">🖨️</button></td>
    </tr>`;
  }).join("");

  const parTrimestreResume = {1:{due:0,paye:0},2:{due:0,paye:0},3:{due:0,paye:0}};
  elevesActifs.forEach(el => {
    [1,2,3].forEach(tt => { parTrimestreResume[tt].due += tarifPourEleve(d.bareme, el, tt); });
  });
  d.paiements.filter(p=>!p.annule).forEach(p => {
    if(parTrimestreResume[p.trimestre]) parTrimestreResume[p.trimestre].paye += Number(p.montant||0);
  });
  const barColors = {1:"#2F6B4F",2:"#3b6fb4",3:"#B8863B"};
  const resumeTrimestreHtml = [1,2,3].map(tt => {
    const r = parTrimestreResume[tt];
    const pct = r.due>0 ? Math.min(100, Math.round(r.paye/r.due*100)) : 0;
    return `
      <div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;">
          <span style="font-weight:600;color:var(--ink);">${tt===1?'1er':tt+'e'} Trimestre</span>
          <span style="opacity:.7;">${money(r.paye)}</span>
        </div>
        <div style="background:#EEE9DA;border-radius:6px;height:8px;overflow:hidden;">
          <div style="background:${barColors[tt]};height:100%;width:${pct}%;border-radius:6px;"></div>
        </div>
        <div style="text-align:right;font-size:10.5px;opacity:.5;margin-top:2px;">${pct}%</div>
      </div>`;
  }).join("");
  const totalEncaisseAnnuel = [1,2,3].reduce((s,tt)=>s+parTrimestreResume[tt].paye,0);

  return `
    <div class="title-row">
      <div>
        <div class="eyebrow">Vue d'ensemble — Trimestre ${t}</div>
        <h1 class="serif">Tableau de bord</h1>
        <p class="subtitle">Suivi du recouvrement des frais scolaires pour le trimestre sélectionné.</p>
      </div>
      ${nbRetard>0 ? `<button class="btn btn-outline" onclick="printRetards(${t})">🖨️ Imprimer la liste des retards (T${t})</button>` : ""}
      <button class="btn" onclick="printAllEleves(${t})">🖨️ Imprimer la liste des élèves (T${t})</button>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:22px;">${tabsHtml}</div>

    <div class="stats-grid">
      <div class="stat-card" style="display:flex;gap:12px;align-items:flex-start;">
        <div class="stat-icon-badge" style="background:#3b6fb4;">👥</div>
        <div><div class="stat-label-v2">Élèves</div><div class="stat-value-v2">${nbEleves}</div><div class="stat-sub">Total actifs</div></div>
      </div>
      <div class="stat-card" style="display:flex;gap:12px;align-items:flex-start;">
        <div class="stat-icon-badge" style="background:#2F6B4F;">💰</div>
        <div><div class="stat-label-v2">Encaissé</div><div class="stat-value-v2">${money(encaisse)}</div><div class="stat-sub">Trimestre ${t}</div></div>
      </div>
      <div class="stat-card" style="display:flex;gap:12px;align-items:flex-start;">
        <div class="stat-icon-badge" style="background:#B8863B;">📌</div>
        <div><div class="stat-label-v2">Dû restant</div><div class="stat-value-v2">${money(retard)}</div><div class="stat-sub">Trimestre ${t}</div></div>
      </div>
      <div class="stat-card" style="display:flex;gap:12px;align-items:flex-start;">
        <div class="stat-icon-badge" style="background:#8b5cf6;">🧾</div>
        <div><div class="stat-label-v2">Paiements</div><div class="stat-value-v2">${d.paiements.filter(p=>!p.annule).length}</div><div class="stat-sub">Total valides</div></div>
      </div>
    </div>

    <div class="form-card" style="background:var(--card);margin-bottom:28px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
        <div class="form-title" style="margin:0;">Résumé des paiements</div>
        <div style="font-size:11px;opacity:.5;">Total : ${money(totalEncaisseAnnuel)}</div>
      </div>
      ${resumeTrimestreHtml}
    </div>

    ${empty ? emptyState("👥","Aucun élève enregistré","Ajoutez des élèves pour voir apparaître le tableau de bord.") : `
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin:0;">Recouvrement par classe et option — Trimestre ${t}</h2>
        <button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="downloadRecouvrementPdf()">⬇️ Télécharger en PDF</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Classe</th><th class="right">Élèves</th><th class="right">Dû</th><th class="right">Encaissé</th><th class="right">Taux</th><th></th></tr></thead>
        <tbody>${classeRows}</tbody>
      </table></div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin:0;">Situation de tous les élèves — Trimestre ${t}</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${state.dashboardShowAll ? `
            <select onchange="onDashboardEleveFiltre(this.value)">
              ${dashboardClasseGroups.map(c=>`<option value="${esc(c.value)}" ${c.value===state.dashboardEleveFiltre?'selected':''}>${esc(c.label)}</option>`).join("")}
            </select>
            <button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="printAllEleves(${t}, state.dashboardEleveFiltre)">🖨️ Imprimer ce filtre</button>
          ` : ""}
          <button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="toggleDashboardShowAll()">${state.dashboardShowAll ? "Masquer" : "Afficher"}</button>
        </div>
      </div>
      ${state.dashboardShowAll ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Élève</th><th>Classe</th><th class="right">Dû</th><th class="right">Encaissé</th><th class="center">État</th></tr></thead>
          <tbody>${tousLesElevesRows}</tbody>
        </table></div>
        ${tousLesEleves.length > 20 ? `
          <div style="text-align:center;margin-top:4px;">
            ${state.dashboardElevesShowAll
              ? `<button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="toggleDashboardElevesShowAll()">Réduire la liste</button>`
              : `<button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="toggleDashboardElevesShowAll()">Afficher tous... (${tousLesEleves.length - 20} de plus)</button>`}
          </div>
        ` : ""}
      ` : ""}
    `}
  `;
}

  state.dashboardElevesShowAll = false;
  renderView();

/* ---------------- Année scolaire (déplacé depuis le Tableau de bord vers Paramètres) ---------------- */
function viewAnneeScolaire(){
  const d = state.data;
  const archiveKeys = Object.keys(d.archives || {}).sort().reverse();
  const archiveRows = archiveKeys.map(annee => {
    const a = d.archives[annee];
    const totalEncaisse = (a.paiements||[]).filter(p=>!p.annule).reduce((s,p)=>s+Number(p.montant||0),0);
    return `<tr>
      <td>${esc(annee)}</td>
      <td class="right">${(a.eleves||[]).length}</td>
      <td class="right">${(a.paiements||[]).length}</td>
      <td class="right">${money(totalEncaisse)}</td>
    </tr>`;
  }).join("");

  return `
    <div class="title-row"><div>
      <div class="eyebrow">Administration</div>
      <h1 class="serif">Année scolaire</h1>
      <p class="subtitle">Archivage annuel et démarrage d'une nouvelle année scolaire.</p>
    </div></div>

    <div class="form-card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div style="font-size:13px;">Année en cours : <b>${esc(d.ecole.anneeScolaire)}</b></div>
        <button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);" onclick="nouvelleAnneeScolaire()">🗓️ Démarrer une nouvelle année scolaire</button>
      </div>
    </div>

    <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:10px;">Années archivées</h2>
    ${archiveKeys.length>0 ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Année archivée</th><th class="right">Élèves</th><th class="right">Paiements</th><th class="right">Total encaissé</th></tr></thead>
        <tbody>${archiveRows}</tbody>
      </table></div>
    ` : `<p style="font-size:12px;opacity:.5;">Aucune année archivée pour l'instant.</p>`}
  `;
}

async function nouvelleAnneeScolaire(){
  const d = state.data;
  const ancienneAnnee = d.ecole.anneeScolaire || "Année précédente";
  const matchYears = ancienneAnnee.match(/(\d{4}).*?(\d{4})/);
  const suggestion = matchYears ? `${Number(matchYears[1])+1}-${Number(matchYears[2])+1}` : "";

  const ok = await showConfirm(
    `Ceci va :\n` +
    `• Archiver les données actuelles (${ancienneAnnee}) — élèves, barème et paiements\n` +
    `• Vider la liste des paiements pour repartir à zéro\n` +
    `• Conserver la liste des élèves (à vous de mettre à jour les classes)\n\n` +
    `Cette action est enregistrée dans le journal. Continuer ?`,
    {title:"Démarrer une nouvelle année scolaire ?", confirmLabel:"Démarrer"}
  );
  if(!ok) return;

  const nouvelleAnnee = await showPrompt("Nom de la nouvelle année scolaire :", suggestion || ancienneAnnee, {title:"Nouvelle année scolaire"});
  if(!nouvelleAnnee || !nouvelleAnnee.trim()) return;

  if(!d.archives) d.archives = {};
  d.archives[ancienneAnnee] = {
    ecole: JSON.parse(JSON.stringify(d.ecole)),
    bareme: JSON.parse(JSON.stringify(d.bareme)),
    eleves: JSON.parse(JSON.stringify(d.eleves)),
    paiements: JSON.parse(JSON.stringify(d.paiements)),
    archiveLe: new Date().toISOString(),
    archivePar: getCurrentUser(),
  };

  journalAdd("Nouvelle année scolaire", `Archivage de ${ancienneAnnee} → passage à ${nouvelleAnnee.trim()} (${d.eleves.length} élèves, ${d.paiements.length} paiements archivés)`);

  if(state.currentEcoleId){
    try{
      await firebase.firestore().collection("ecoles").doc(state.currentEcoleId)
        .collection("archives").doc(ancienneAnnee).set(d.archives[ancienneAnnee]);
    }catch(e){ console.error("Synchronisation de l'archive impossible :", e); }
  }

  d.paiements = [];
  d.ecole.anneeScolaire = nouvelleAnnee.trim();
  state.dashboardShowAll = false;

  saveData(); render();
  await showAlert(`Nouvelle année scolaire \u00ab ${nouvelleAnnee.trim()} \u00bb démarrée.\n\nL'année ${ancienneAnnee} est archivée et consultable en bas du tableau de bord.`);
}

function emptyState(icon,title,text){
  return `<div class="empty"><div class="icon">${icon}</div><div class="t">${esc(title)}</div><div class="d">${esc(text)}</div></div>`;
}

/* ---------------- Journal d'activité ---------------- */
function viewJournal(){
  const d = state.data;
  const journal = d.journal || [];
  const sorted = [...journal].sort((a,b) => (b.ts||"").localeCompare(a.ts||""));
  const visible = sorted.slice(0, state.journalVisibleCount);

  const rows = visible.map(entry => `
    <tr>
      <td style="white-space:nowrap;opacity:.7;">${formatDateTimeFr(entry.ts)}</td>
      <td style="font-weight:600;">${esc(entry.user)}</td>
      <td>${esc(entry.action)}</td>
      <td style="opacity:.75;">${esc(entry.detail)}</td>
    </tr>`).join("");

  return `
    <div class="title-row"><div>
      <div class="eyebrow">Traçabilité</div>

function downloadDebiteursPdf(trimestre, classeFiltre){
  const d = state.data;
  const t = trimestre || 1;
  const payMap = paiementsParEleve(d.paiements);
  let eleves = d.eleves.filter(e=>!e.archive);
  if(classeFiltre && classeFiltre !== "Toutes"){
    eleves = eleves.filter(e => (e.classe||"Sans classe") + "||" + (e.option||"") === classeFiltre);
  }
  const debiteurs = eleves.map(el => {
    const due = tarifPourEleve(d.bareme, el, t);
    const paye = payeTotal(payMap, el.id, t);
    return { el, due, paye, solde: due-paye };
  }).filter(r=>r.solde>0).sort((a,b)=>b.solde-a.solde);

  const columns = [
    {label:"Élève", width:170}, {label:"Classe", width:120},
    {label:"Dû", width:85}, {label:"Encaissé", width:85}, {label:"Solde", width:85},
  ];
  const rows = debiteurs.map(({el,due,paye,solde}) => [
    `${el.nom} ${el.postnom} ${el.prenom}`, classeOptionLabel(el), money(due), money(paye), money(solde)
  ]);
  const total = debiteurs.reduce((s,r)=>s+r.solde,0);
  const classeLabel = (classeFiltre && classeFiltre !== "Toutes")
    ? classeOptionGroups(d.eleves.filter(e=>!e.archive)).find(c=>c.value===classeFiltre)?.label
    : null;

  const bytes = buildTablePdfPages(
    `Liste des débiteurs — Trimestre ${t}` + (classeLabel ? ` — ${classeLabel}` : ""),
    `${d.ecole.nom} — Année scolaire ${d.ecole.anneeScolaire} — ${debiteurs.length} élève(s)`,
    columns, rows, [`Total dû : ${money(total)}`]
  );
  downloadPdfBytes(bytes, `debiteurs-T${t}${classeLabel ? "-"+classeLabel.replace(/[^\w-]/g,"") : ""}.pdf`);
}

/* ---------------- Statistiques ---------------- */
function viewStatistiques(){
  const d = state.data;
  const t = state.dashboardTrimestre || 1;
  const elevesActifs = d.eleves.filter(e => !e.archive);
  const payMap = paiementsParEleve(d.paiements);

  let attendu=0, encaisse=0;
  const parSexe = { M:0, F:0 };
  const parStatut = {};
  const parOption = {};

  elevesActifs.forEach(el => {
    const due = tarifPourEleve(d.bareme, el, t);
    const paye = payeTotal(payMap, el.id, t);
    attendu += due; encaisse += paye;
    parSexe[el.sexe] = (parSexe[el.sexe]||0) + 1;
    parStatut[el.statut] = (parStatut[el.statut]||0) + 1;
    const opt = el.option || "Sans option";
    if(!parOption[opt]) parOption[opt] = { n:0, due:0, paye:0 };
    parOption[opt].n++; parOption[opt].due += due; parOption[opt].paye += paye;
  });

  const tauxGlobal = attendu>0 ? Math.round(encaisse/attendu*100) : 0;
  const nbPaiementsActifs = d.paiements.filter(p=>!p.annule).length;
  const nbAnnules = d.paiements.filter(p=>p.annule).length;

  const optionRows = Object.entries(parOption).sort((a,b)=>b[1].n-a[1].n).map(([opt,v]) => {
    const taux = v.due>0 ? Math.round(v.paye/v.due*100) : 0;
    return `<tr><td>${esc(opt)}</td><td class="right">${v.n}</td><td class="right">${money(v.due)}</td><td class="right pos">${money(v.paye)}</td><td class="right">${taux}%</td></tr>`;
  }).join("");

  return `
    <div class="title-row"><div>
      <div class="eyebrow">Vue d'ensemble</div>
      <h1 class="serif">Statistiques</h1>
      <p class="subtitle">Indicateurs globaux pour le trimestre ${t}, tous établissements confondus.</p>
    </div></div>

    <div class="stats-grid" style="margin-bottom:28px;">
      <div class="stat-card"><div class="stat-value serif">${elevesActifs.length}</div><div class="stat-label">Élèves actifs</div></div>
      <div class="stat-card"><div class="stat-value serif">${tauxGlobal}%</div><div class="stat-label">Taux de recouvrement</div></div>
      <div class="stat-card"><div class="stat-value serif">${nbPaiementsActifs}</div><div class="stat-label">Paiements valides</div></div>
      <div class="stat-card"><div class="stat-value serif ${nbAnnules>0?'neg':''}">${nbAnnules}</div><div class="stat-label">Paiements annulés</div></div>
    </div>

    <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:10px;">Répartition par sexe</h2>
    <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:24px;">
      <div class="stat-card"><div class="stat-value serif">${parSexe.M||0}</div><div class="stat-label">Garçons</div></div>
      <div class="stat-card"><div class="stat-value serif">${parSexe.F||0}</div><div class="stat-label">Filles</div></div>
    </div>

    <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:10px;">Recouvrement par option — Trimestre ${t}</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Option</th><th class="right">Élèves</th><th class="right">Dû</th><th class="right">Encaissé</th><th class="right">Taux</th></tr></thead>
      <tbody>${optionRows}</tbody>
    </table></div>
  `;
}

/* ---------------- Recettes par période ---------------- */
function moisFr(iso){
  const noms = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const [y,m] = (iso||"").split("-");
  if(!y||!m) return "—";
  return `${noms[Number(m)-1]} ${y}`;
}

function viewRecettes(){
  const d = state.data;
  const actifs = d.paiements.filter(p => !p.annule);

  const parMois = {};
  actifs.forEach(p => {
    const key = (p.date||"").slice(0,7); // AAAA-MM
    if(!key) return;
    if(!parMois[key]) parMois[key] = { total:0, n:0 };
    parMois[key].total += Number(p.montant||0);
    parMois[key].n++;
  });
  const moisTries = Object.keys(parMois).sort();

  const totalPeriode = actifs
    .filter(p => (!state.recettesDebut || p.date >= state.recettesDebut) && (!state.recettesFin || p.date <= state.recettesFin))
    .reduce((s,p)=>s+Number(p.montant||0),0);

  const rows = moisTries.map(key => {
    const m = parMois[key];
    return `<tr>
      <td>${moisFr(key+"-01")}</td>
      <td class="right">${m.n}</td>
      <td class="right pos">${money(m.total)}</td>
    </tr>`;
  }).join("");

  const totalGeneral = actifs.reduce((s,p)=>s+Number(p.montant||0),0);

  return `
    <div class="title-row"><div>
      <div class="eyebrow">Encaissements</div>
      <h1 class="serif">Recettes par période</h1>
      <p class="subtitle">Vue d'ensemble des encaissements, mois par mois, et sur une période personnalisée.</p>
    </div></div>

    <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:24px;">
      <div class="stat-card"><div class="stat-value serif pos">${money(totalGeneral)}</div><div class="stat-label">Total encaissé (toutes périodes)</div></div>
      <div class="stat-card"><div class="stat-value serif">${actifs.length}</div><div class="stat-label">Paiements valides</div></div>
    </div>

    ${moisTries.length===0 ? emptyState("📅","Aucune recette enregistrée","Les paiements apparaîtront ici, regroupés par mois.") : `
      <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:10px;">Recettes par mois</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Mois</th><th class="right">Paiements</th><th class="right">Total encaissé</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    `}

    <div class="form-card">
      <div class="form-title">Période personnalisée</div>
      <div class="form-row">
        <div class="field"><label>Du</label><input type="date" id="recettes-debut" value="${esc(state.recettesDebut||"")}" onchange="onRecettesPeriode()"></div>
        <div class="field"><label>Au</label><input type="date" id="recettes-fin" value="${esc(state.recettesFin||"")}" onchange="onRecettesPeriode()"></div>
        <div class="field wide">
          <label>Total sur cette période</label>
          <div style="font-size:20px;font-weight:600;font-family:Georgia,serif;color:var(--paid);padding-top:4px;">${money(totalPeriode)}</div>
        </div>
        <button class="btn" onclick="printRecettes()">🖨️ Imprimer ce rapport</button>
      </div>
    </div>
  `;
}

  const html = `

    if(field==="nom" || field==="postnom" || field==="classe") eleveDupIndexArr = null;
    if(old !== value) journalAdd("Modification élève", `${el.nom} ${el.postnom} — ${field} : "${old}" → "${value}"`);
